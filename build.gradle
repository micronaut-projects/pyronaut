plugins {
    id "io.micronaut.build.internal.parent"
}

// The aggregated Javadoc configuration is owned by this root project rather
// than a module applying the Pyronaut convention plugin.
repositories {
    mavenCentral()
}

// The platform BOM aligns Micronaut modules. These remaining transitive
// libraries are outside that BOM, so keep their versions identical across all
// CLI tools packaged into the wheel.
def pyronautCliDependencyVersions = [
    "org.jetbrains:annotations": libs.versions.annotations.get(),
    "commons-codec:commons-codec": libs.versions.commons.codec.get(),
    "com.ibm.icu:icu4j": libs.versions.icu4j.get(),
    "org.graalvm.shadowed:icu4j": libs.versions.graalvm.icu4j.get()
]
def graalvmRuntimeGroups = [
    "org.graalvm.js",
    "org.graalvm.polyglot",
    "org.graalvm.python",
    "org.graalvm.regex",
    "org.graalvm.sdk",
    "org.graalvm.shadowed",
    "org.graalvm.tools",
    "org.graalvm.truffle"
]

def pyronautCliProjectNames = [
    "micronaut-pyronaut",
    "micronaut-pyronaut-install",
    "micronaut-pyronaut-processor",
    "micronaut-pyronaut-dev",
    "micronaut-pyronaut-run",
    "micronaut-pyronaut-run-python",
    "micronaut-pyronaut-test",
    "micronaut-pyronaut-native-build",
    "micronaut-pyronaut-jar-build",
    "micronaut-pyronaut-validate-config",
    "micronaut-pyronaut-test-resources-server",
    "micronaut-pyronaut-tui"
]

subprojects.findAll { it.name in pyronautCliProjectNames }.each { cliProject ->
    cliProject.configurations.configureEach {
        resolutionStrategy.force(pyronautCliDependencyVersions.collect { module, version -> "${module}:${version}" })
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group in graalvmRuntimeGroups) {
                details.useVersion(libs.versions.graalpy.get())
            }
        }
    }
}

def disabledSonatypePublishingTasks = [
    "publishToSonatype",
    "closeSonatypeStagingRepository",
    "releaseSonatypeStagingRepository",
    "closeAndReleaseSonatypeStagingRepository"
] as Set

disabledSonatypePublishingTasks.each { taskName ->
    if (tasks.findByName(taskName) == null) {
        tasks.register(taskName) {
            group = "publishing"
            description = "Temporarily disabled until Pyronaut Sonatype publishing is enabled."
            enabled = false
        }
    }
}

// Published native images are memory intensive and compete for the same
// GraalVM/native-image resources. Order the actual image tasks explicitly;
// ordering only their containing bundle tasks would still allow Gradle to
// start the image dependencies in parallel. Other build tasks remain parallel.
def nativeImageTaskPaths = [
        ":micronaut-pyronaut-dev:nativeCompile",
        ":micronaut-pyronaut-run:buildCremaNativeImage",
        ":micronaut-pyronaut-run-python:buildCremaNativeImage"
]
allprojects {
    pluginManager.withPlugin("java") {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }
    pluginManager.withPlugin("org.jetbrains.kotlin.jvm") {
        kotlin {
            jvmToolchain(25)
        }
    }
    tasks.configureEach { task ->
        def lowerCaseTaskName = task.name.toLowerCase(Locale.ROOT)
        if (task.name in disabledSonatypePublishingTasks || (lowerCaseTaskName.startsWith("publish") && lowerCaseTaskName.contains("sonatype"))) {
            enabled = false
        }
        def taskIndex = nativeImageTaskPaths.indexOf(task.path)
        if (taskIndex > 0) {
            task.mustRunAfter(nativeImageTaskPaths[taskIndex - 1])
        }
    }
}

gradle.projectsEvaluated {
    allprojects {
        pluginManager.withPlugin("java") {
            java.toolchain.languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

// The test JVMs are CPU bound on the 4 vCPU CI runners. Most tests create short-lived GraalPy
// contexts whose Truffle-compiled code is thrown away with the engine, so the Truffle compiler
// threads burn CPU without paying off. Run Python interpreter-only and compile the host code with
// C2, which compiles far less eagerly than the Graal JIT (same as micronaut-core's Python CI).
def testJvmArgs = [
    "-XX:+UnlockExperimentalVMOptions",
    "-XX:-UseJVMCICompiler",
    "-XX:+UseParallelGC",
    // Unlike polyglot.engine.Compilation=false, this runtime exists on every JDK
    "-Dtruffle.TruffleRuntime=com.oracle.truffle.api.impl.DefaultTruffleRuntime",
    "-Dpolyglot.engine.WarnInterpreterOnly=false"
]
// The JaCoCo agent instruments every class a test loads by default, including GraalPy, Truffle and
// the Micronaut Python compiler, while the coverage reports only cover the Pyronaut classes
def jacocoIncludes = [
    "io.micronaut.pyronaut.*",
    "io.micronaut.python.cli.*",
    "io.micronaut.python.logging.*",
    "io.micronaut.test.pytest.*",
    "io.micronaut.core.io.service.*"
]
subprojects {
    tasks.withType(Test).configureEach {
        jvmArgs(testJvmArgs)
    }
    pluginManager.withPlugin("jacoco") {
        tasks.withType(Test).configureEach {
            jacoco {
                includes = jacocoIncludes
            }
        }
    }
}
// micronaut-build turns the JaCoCo agent on for every test on GitHub Actions, but only the Sonar
// analysis reads the coverage, and it only runs with a SONAR_TOKEN. Registered once all projects are
// evaluated so that it runs after the plugin's own configuration.
if (!System.getenv("SONAR_TOKEN")?.trim()) {
    gradle.projectsEvaluated {
        subprojects {
            pluginManager.withPlugin("jacoco") {
                tasks.withType(Test).configureEach {
                    jacoco.enabled = false
                }
            }
        }
    }
}
