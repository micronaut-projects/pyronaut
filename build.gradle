plugins {
    id "io.micronaut.build.internal.parent"
}

// The aggregated Javadoc configuration is owned by this root project rather
// than a module applying the Pyronaut convention plugin. It therefore needs
// the snapshot repository explicitly when the Micronaut platform is built
// against a snapshot core BOM.
repositories {
    mavenCentral()
    maven {
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

def disabledSonatypePublishingTasks = [
    "publishToSonatype",
    "closeSonatypeStagingRepository",
    "releaseSonatypeStagingRepository",
    "closeAndReleaseSonatypeStagingRepository"
] as Set

disabledSonatypePublishingTasks.each { taskName ->
    if (tasks.findByName(taskName) == null) {
        tasks.register(taskName) {
            group = "publishing"
            description = "Temporarily disabled until Pyronaut Sonatype publishing is enabled."
            enabled = false
        }
    }
}

// A native SDK wheel embeds these three launchers. Native-image processes are
// memory intensive, so order them explicitly without disabling parallelism for
// the rest of the build.
def nativeSdkWheelImageTaskPaths = [
        ":micronaut-pyronaut-dev:nativeCompile",
        ":micronaut-pyronaut-run:buildCremaNativeImage",
        ":micronaut-pyronaut-run-python:buildCremaNativeImage"
]
allprojects {
    pluginManager.withPlugin("java") {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }
    pluginManager.withPlugin("org.jetbrains.kotlin.jvm") {
        kotlin {
            jvmToolchain(25)
        }
    }
    tasks.configureEach { task ->
        def lowerCaseTaskName = task.name.toLowerCase(Locale.ROOT)
        if (task.name in disabledSonatypePublishingTasks || (lowerCaseTaskName.startsWith("publish") && lowerCaseTaskName.contains("sonatype"))) {
            enabled = false
        }
        def taskIndex = nativeSdkWheelImageTaskPaths.indexOf(task.path)
        if (taskIndex > 0) {
            task.mustRunAfter(nativeSdkWheelImageTaskPaths[taskIndex - 1])
        }
    }
}

gradle.projectsEvaluated {
    allprojects {
        pluginManager.withPlugin("java") {
            java.toolchain.languageVersion = JavaLanguageVersion.of(25)
        }
    }
}
