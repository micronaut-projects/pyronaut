[project]
name="pyronaut-demo"
version="1.0.0"
dynamic = ["scripts"]

[build-system]
requires = [ "setuptools", "wheel", "tomli"]
build-backend = "setuptools.build_meta"

[tool.pyronaut]
repositories = [
    "mavenCentral",
    "https://repo.gradle.org/gradle/libs-releases"
]

[tool.pyronaut.build]
mode = "jvm"

[tool.pyronaut.processor]
mode = "jvm"
incremental = false

[tool.pyronaut.dependencies]
runtime = [ "io.micronaut:micronaut-inject-python",
    "io.micronaut:micronaut-context-python",
    "io.micronaut:micronaut-http-server-netty", "io.micronaut:micronaut-json-core",
    "io.micronaut:micronaut-jackson-databind",
    "ch.qos.logback:logback-classic",
    "org.bouncycastle:bcprov-jdk18on",
    "org.apache.commons:commons-lang3:3.20.0",
]

build = [
    "io.micronaut:micronaut-inject-python",
    "io.micronaut:micronaut-context-python",
]
development-runtime = [
    "io.micronaut.controlpanel:micronaut-control-panel-management",
]
test = [
    "org.junit.platform:junit-platform-launcher",
    "io.micronaut:micronaut-pytest-engine",
    "io.micronaut.test:micronaut-test-junit5",
    "org.junit.jupiter:junit-jupiter-engine"
]
