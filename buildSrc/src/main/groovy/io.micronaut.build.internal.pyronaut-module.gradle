import static io.micronaut.build.TestFramework.JUNIT6

import org.gradle.api.GradleException
import org.gradle.jvm.toolchain.JavaLanguageVersion
import org.gradle.jvm.toolchain.JavaToolchainService
import org.gradle.jvm.toolchain.JvmVendorSpec
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.nio.file.attribute.UserDefinedFileAttributeView

plugins {
    id 'io.micronaut.build.internal.pyronaut-base'
    id "io.micronaut.build.internal.module"
}
micronautBuild {
    descriptor {
        parentModuleId = "io.micronaut.pyronaut:micronaut-pyronaut"
    }
    testFramework = JUNIT6
    binaryCompatibility {
        enabledAfter "1.0.0"
    }
}

repositories {
    def graalPyBundleRepo = System.getProperty("pyronaut.graalpy.bundle.repo")
    if (graalPyBundleRepo != null && !graalPyBundleRepo.isBlank()) {
        maven {
            url = uri(graalPyBundleRepo)
        }
    }
    maven {
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        mavenContent {
            snapshotsOnly()
        }
    }
}

tasks.withType(Checkstyle).configureEach {
    exclude {
        it.toString().contains('generated')
    }
}

def ensureMacOsGatekeeperDoesNotBlock = { File javaHome ->
    def osName = System.getProperty("os.name", "").toLowerCase(Locale.ROOT)
    if (!osName.contains("mac") || javaHome == null) {
        return
    }

    def isQuarantined = [javaHome.toPath(), javaHome.toPath().resolve("bin/java")].any { candidate ->
        try {
            def view = Files.getFileAttributeView(candidate, UserDefinedFileAttributeView)
            view != null && view.list().contains("com.apple.quarantine")
        } catch (Exception ignored) {
            false
        }
    }

    if (isQuarantined) {
        throw new GradleException(
            """The provisioned GraalVM dev build at '${javaHome.absolutePath}' is blocked by macOS Gatekeeper.

Run:
xattr -r -d com.apple.quarantine '${javaHome.absolutePath}'

If permissions prevent that, rerun the same command with sudo."""
        )
    }
}

def ensureNativeImageLauncherIsUsable = { File javaHome ->
    if (javaHome == null) {
        return
    }

    def launcher = new File(javaHome, "bin/native-image")
    def realLauncher = new File(javaHome, "lib/svm/bin/native-image")
    if (!realLauncher.isFile() || !realLauncher.canExecute()) {
        return
    }
    if (launcher.isFile() && launcher.canExecute() && launcher.length() > 0) {
        return
    }

    launcher.parentFile.mkdirs()
    Files.deleteIfExists(launcher.toPath())
    try {
        Files.createSymbolicLink(launcher.toPath(), realLauncher.toPath())
    } catch (UnsupportedOperationException | IOException ignored) {
        Files.copy(realLauncher.toPath(), launcher.toPath(), StandardCopyOption.REPLACE_EXISTING)
        launcher.setExecutable(true, false)
    }
}

pluginManager.withPlugin("org.graalvm.buildtools.native") {
    def ciNativeImageArgs = providers.gradleProperty("pyronautNativeImageCiArgs").map { value ->
        value.trim().split(/\s+/).findAll { arg -> !arg.isBlank() }
    }.orElse([])
    def graalVmDevTag = providers.gradleProperty("pyronautGraalVmDevTag")
    if (graalVmDevTag.present) {
        def matcher = (graalVmDevTag.get() =~ /(jdk-)?(\d+)/)
        if (!matcher.find()) {
            throw new GradleException("Unable to extract a Java language version from pyronautGraalVmDevTag='${graalVmDevTag.get()}'")
        }

        Integer devJavaVersion = Integer.parseInt(matcher.group(2))
        def javaToolchains = extensions.getByType(JavaToolchainService)
        def graalVmLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(devJavaVersion)
            vendor = JvmVendorSpec.GRAAL_VM
        }.map { launcher ->
            def javaHome = launcher.metadata.installationPath.asFile
            ensureNativeImageLauncherIsUsable(javaHome)
            ensureMacOsGatekeeperDoesNotBlock(javaHome)
            launcher
        }

        graalvmNative {
            toolchainDetection = true
            binaries.configureEach {
                javaLauncher = graalVmLauncher
                buildArgs.addAll(ciNativeImageArgs)
            }
        }
    }
}
