import static io.micronaut.build.TestFramework.JUNIT6


plugins {
    id 'io.micronaut.build.internal.pyronaut-base'
    id "io.micronaut.build.internal.module"
}

def micronautPlatformVersion = providers.gradleProperty("pyronaut.micronaut.platform.version")

dependencies {
    api(platform("io.micronaut.platform:micronaut-platform:${micronautPlatformVersion.get()}"))
}

// GraalPy's Python embedding artifact pulls this optional legacy crypto
// support module transitively. Pyronaut does not use it, and keeping it out
// of every module's graph avoids shipping the unnecessary Bouncy Castle
// runtime alongside Micronaut's Python integration.
configurations.configureEach {
    exclude(group: "org.graalvm.python", module: "python-bouncycastle-support")
}

micronautBuild {
    descriptor {
        parentModuleId = "io.micronaut.pyronaut:micronaut-pyronaut"
    }
    testFramework = JUNIT6
    binaryCompatibility {
        enabledAfter "1.0.0"
    }
}

tasks.withType(Checkstyle).configureEach {
    exclude {
        it.toString().contains('generated')
    }
}

pluginManager.withPlugin("io.micronaut.build.internal.nullaway") {
    micronautNullAway {
        disableOnProjectNameContains.add(project.name)
        disabledChecks.add("NullAway")
    }
}

pluginManager.withPlugin("org.graalvm.buildtools.native") {
    def ciNativeImageArgs = providers.gradleProperty("pyronautNativeImageCiArgs").map { value ->
        value.trim().split(/\s+/).findAll { arg -> !arg.isBlank() }
    }.orElse([])
    graalvmNative {
        toolchainDetection = true
        binaries.configureEach {
            buildArgs.addAll(ciNativeImageArgs)
        }
    }
}
