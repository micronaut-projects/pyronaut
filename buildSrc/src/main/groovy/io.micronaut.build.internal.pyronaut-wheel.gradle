plugins {
    id "base"
}

import io.micronaut.build.internal.pyronautwheel.BuildWheelTask

configurations {
    wheel {
        canBeResolved = true
        canBeConsumed = false
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, "distribution"))
        }
    }
}

def pythonExecutableProvider = providers.gradleProperty("pythonExecutable")

tasks.register("buildWheel", BuildWheelTask) {
    group = "build"
    description = "Builds the pyronaut wheel in an isolated sandbox and collects the resulting .whl files."

    pythonExecutable = pythonExecutableProvider

    // Build from pyronaut-wheel/ sources, but stage into a sandbox under this project's build directory.
    sourcesDir = layout.projectDirectory
    workDir = layout.buildDirectory.dir("work")

    // Collect final artifacts under pyronaut-wheel/build/wheels
    wheelsDir = layout.buildDirectory.dir("wheels")

    cliZipFile = configurations.wheel.incoming.files.singleFile
}
