[versions]
micronaut = "5.0.0-SNAPSHOT"
micronaut-serde = "3.0.0-M1"
micronaut-picocli = "6.0.0-M1"
micronaut-platform = "4.10.5"
micronaut-logging = "1.7.1"
micronaut-projectgen = "0.0.9"
micronaut-views = "5.9.0"
micronaut-validation = "5.0.0-M1"
tomlj="1.1.1"
gradle-tapi = "9.2.1"
tamboui = "0.1.0"
maven-resolver = "2.0.16"
maven = "3.9.9"
slf4j = "2.0.17"

[libraries]
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-logging = { module = "io.micronaut.logging:micronaut-logging-bom", version.ref = "micronaut-logging" }
micronaut-views = { module = "io.micronaut.views:micronaut-views-bom", version.ref = "micronaut-views" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }
micronaut-picocli = { module = 'io.micronaut.picocli:micronaut-picocli-bom', version.ref = 'micronaut-picocli' }
micronaut-projectgen = { module = 'io.micronaut.projectgen:micronaut-projectgen-bom', version.ref = 'micronaut-projectgen' }
micronaut-projectgen-core = { module = 'io.micronaut.projectgen:micronaut-projectgen-core' }
micronaut-projectgen-http-server = { module = 'io.micronaut.projectgen:micronaut-projectgen-http-server' }
micronaut-projectgen-test = { module = 'io.micronaut.projectgen:micronaut-projectgen-test' }

tomlj = { module = "org.tomlj:tomlj", version.ref="tomlj"}
gradle-tapi = { module = "org.gradle:gradle-tooling-api", version.ref = "gradle-tapi" }
tamboui = { module = "dev.tamboui:tamboui-toolkit", version.ref = "tamboui"}
tamboui-jline = { module = "dev.tamboui:tamboui-jline3-backend", version.ref = "tamboui"}
tamboui-panama = { module = "dev.tamboui:tamboui-panama-backend", version.ref = "tamboui"}
tamboui-annotations = { module = "dev.tamboui:tamboui-annotations", version.ref = "tamboui"}
tamboui-annotation-processor = { module = "dev.tamboui:tamboui-processor", version.ref = "tamboui"}

maven-resolver-api = { module = "org.apache.maven.resolver:maven-resolver-api", version.ref = "maven-resolver" }
maven-resolver-util = { module = "org.apache.maven.resolver:maven-resolver-util", version.ref = "maven-resolver" }
maven-resolver-impl = { module = "org.apache.maven.resolver:maven-resolver-impl", version.ref = "maven-resolver" }
maven-resolver-connector-basic = { module = "org.apache.maven.resolver:maven-resolver-connector-basic", version.ref = "maven-resolver" }
maven-resolver-transport-file = { module = "org.apache.maven.resolver:maven-resolver-transport-file", version.ref = "maven-resolver" }
maven-resolver-transport-jdk = { module = "org.apache.maven.resolver:maven-resolver-transport-jdk", version.ref = "maven-resolver" }
maven-resolver-supplier-mvn3 = { module = "org.apache.maven.resolver:maven-resolver-supplier-mvn3", version.ref = "maven-resolver" }
maven-resolver-provider = { module = "org.apache.maven:maven-resolver-provider", version.ref = "maven" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[bundles]

[plugins]
