# pyronaut-dev PGO training workload for a pyproject.toml project with only Java sources.
# pyronaut-run trains on ../java-maven instead: a pyproject.toml project always resolves the GraalPy
# runtime, which the pyronaut-run image does not contain.
# @REPOSITORY@ is replaced by the training driver with the staged Pyronaut artifact repository.

[project]
name = 'pyronaut-pgo-training-java'
version = '1.0.0'

[tool.pyronaut]
repositories = ['@REPOSITORY@', 'mavenCentral']

[tool.pyronaut.processor]
incremental = true
daemon = false

[tool.pyronaut.test-resources]
enabled = false

[tool.pyronaut.sources]
java = 'src-java'
resources = 'config'

[tool.pyronaut.dependencies]
boms = [
  'io.micronaut.serde:micronaut-serde-bom:3.2.4',
  'io.micronaut.validation:micronaut-validation-bom:5.2.1',
]
runtime = [
  'io.micronaut:micronaut-http-server-netty',
  'io.micronaut.serde:micronaut-serde-jackson',
  'io.micronaut.validation:micronaut-validation',
]
build = [
  'io.micronaut.serde:micronaut-serde-processor',
  'io.micronaut.validation:micronaut-validation-processor',
]
