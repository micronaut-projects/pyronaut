[micronaut.application]
name = "pgo-training"

[micronaut.server]
# The training driver rewrites this with a free port.
port = 8080
host = "localhost"

[datasources.default]
url = "jdbc:h2:mem:training;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
username = "sa"
password = ""
driver-class-name = "org.h2.Driver"
dialect = "H2"
schema-generate = "CREATE_DROP"
