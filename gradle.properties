projectVersion=0.0.9
projectGroup=io.micronaut.pyronaut
pyronaut.micronaut.core.version=5.2.12
pyronaut.micronaut.platform.version=5.2.1

title=Pyronaut
projectDesc=Tools for Python + Micronaut integration
projectUrl=https://micronaut.io
githubSlug=micronaut-projects/pyronaut
developers=Graeme Rocher

# C2 compiles the Gradle daemon with less CPU than the Graal JIT of the GraalVM JDK CI runs on
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UnlockExperimentalVMOptions -XX:-UseJVMCICompiler
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Default GraalPy pyenv version used by the SDK wheel install task.
pyronautPyenvVersion=graalpy3.13-25.4.4
# On macOS, manually clear com.apple.quarantine on the installed JDK if Gatekeeper blocks execution.
