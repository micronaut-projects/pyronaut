projectVersion=0.0.1-SNAPSHOT
projectGroup=io.micronaut.pyronaut
pyronaut.micronaut.core.version=5.1.0-SNAPSHOT
pyronaut.micronaut.platform.version=5.0.0

title=Pyronaut
projectDesc=Tools for Python + Micronaut integration
projectUrl=https://micronaut.io
githubSlug=micronaut-projects/micronaut-pyronaut
developers=Graeme Rocher

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true

# Optional: pin GraalVM provisioning to a graalvm-ce-dev-builds GitHub release tag,
# or an oracle-graalvm-ea-builds EE tag such as jdk-25e1-25.0.3-ea.32.
pyronautGraalVmDevTag=jdk-25e1-25.0.3-ea.32
# Default GraalPy pyenv version used by the SDK wheel install task.
pyronautPyenvVersion=graalpy3.12-25.1.3
# On macOS, manually clear com.apple.quarantine on the installed JDK if Gatekeeper blocks execution.
