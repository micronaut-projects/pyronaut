<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Pyronaut Test Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
<style>body{margin:24px;background:#f8f9fa;} .report-shell{max-width:1100px;margin:0 auto;} .micronaut-logo{width:320px;max-width:100%;height:auto;display:block;margin:0 auto 1rem auto;} .micronaut-logo-fallback{display:none;text-align:center;font-weight:800;font-size:1.75rem;letter-spacing:.02em;color:#ff4500;margin:0 auto 1rem auto;} .micronaut-logo--failed .micronaut-logo-fallback{display:block;} details>summary{cursor:pointer;list-style:none;} details>summary::-webkit-details-marker{display:none;} pre{white-space:pre-wrap;word-break:break-word;} .status-badge{font-size:.85rem;} </style>
</head><body>
<main class="report-shell">
<div class="card shadow-sm"><div class="card-body">
<div class="micronaut-brand" aria-label="Micronaut">
  <img
    class="micronaut-logo"
    src="https://micronaut.io/wp-content/uploads/2020/11/MIcronautLogo_Horizontal.svg"
    alt="Micronaut"
    loading="lazy"
    referrerpolicy="no-referrer"
    onerror="this.style.display='none';this.parentElement?.classList.add('micronaut-logo--failed');"
  >
  <div class="micronaut-logo-fallback" data-pyronaut-logo-fallback>
    Micronaut
    <span class="text-body-secondary">(logo unavailable — offline-safe fallback)</span>
    <span class="visually-hidden">Official logo source: https://micronaut.io</span>
  </div>
</div>
<h1 class="h3 text-center mb-3">Pyronaut Test Report</h1>
<div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
<span class="badge text-bg-secondary">Total: 0</span><span class="badge text-bg-success">Passed: 0</span><span class="badge text-bg-danger">Failed: 0</span></div>
</div></div></main>
</body></html>
