def mavenVersionDirReady = { File versionDir, String artifactId ->
    if (!versionDir.isDirectory()) {
        return false
    }
    if (new File(versionDir, "maven-metadata.xml").isFile() || new File(versionDir, "maven-metadata-local.xml").isFile()) {
        return true
    }
    if (new File(versionDir, "${artifactId}-${versionDir.name}.pom").isFile()) {
        return true
    }
    def files = versionDir.listFiles()
    files != null && files.any { it.isFile() && (it.name.endsWith(".pom") || it.name.endsWith(".jar")) }
}
def requireMavenVersionDir = { File repositoryDir, String relativePath, String artifactId ->
    def versionDir = new File(repositoryDir, relativePath)
    if (!mavenVersionDirReady(versionDir, artifactId)) {
        throw new GradleException("Expected ${artifactId} artifacts in ${versionDir.absolutePath}")
    }
}
def requireMavenArtifactFile = { File repositoryDir, String relativePath, String fileName ->
    def artifactFile = new File(new File(repositoryDir, relativePath), fileName)
    if (!artifactFile.isFile()) {
        throw new GradleException("Expected Maven artifact file: ${artifactFile.absolutePath}")
    }
}
def graalVmDistributionForTag = { String tag ->
    tag ==~ /(?:jdk-)?\d+e\d+-.+/ ? "ee" : "dev"
}
def graalVmJavaVersionForTag = { String tag ->
    def matcher = tag =~ /(\d+)/
    matcher.find() ? matcher.group(1) : "25"
}

tasks.register("prepareSdkMavenLocalEnvironment") {
    group = "build setup"
    description = "Publishes local Pyronaut, included Micronaut Core, and GraalPy snapshot artifacts to the Maven local repository used by demo applications."
    dependsOn({
        rootProject.subprojects
            .collect { it.tasks.findByName("publishToMavenLocal") }
            .findAll { it != null }
    })
    def micronautCoreIncludedBuild = gradle.includedBuilds.find { it.name == "micronaut-core" }
    def includedMicronautCorePresent = micronautCoreIncludedBuild != null
    if (micronautCoreIncludedBuild != null) {
        dependsOn(includedMicronautCoreArtifactIds.collect { artifactId ->
            micronautCoreIncludedBuild.task(":${artifactId}:publishToMavenLocal")
        })
    }
    inputs.property("micronautCoreVersion", micronautCoreVersion)
    inputs.property("graalPyVersion", graalPyVersion)
    inputs.property("pyronautVersion", providers.provider { project.version.toString() })
    inputs.property("includedMicronautCore", includedMicronautCorePresent)
    inputs.dir(effectiveMavenLocalRepositoryDir).optional()
    outputs.dir(sdkMavenLocalRepositoryDir)
    outputs.upToDateWhen { false }
    doLast {
        def sourceRepository = effectiveMavenLocalRepositoryDir.get().canonicalFile
        def targetRepository = sdkMavenLocalRepositoryDir.get().canonicalFile
        if (!sourceRepository.isDirectory()) {
            throw new GradleException("Missing effective Maven local repository: ${sourceRepository.absolutePath}")
        }
        targetRepository.mkdirs()

        if (sourceRepository != targetRepository) {
            def relativePaths = ["io/micronaut/pyronaut"] +
                includedMicronautCoreArtifactIds.collect { "io/micronaut/${it}" } +
                ["org/graalvm"]
            relativePaths.unique().each { relativePath ->
                def sourceDir = new File(sourceRepository, relativePath)
                if (sourceDir.isDirectory()) {
                    copy {
                        from(sourceDir)
                        into(new File(targetRepository, relativePath))
                    }
                }
            }
        }

        requireMavenVersionDir(
            targetRepository,
            "io/micronaut/pyronaut/micronaut-pyronaut-bom/${project.version}",
            "micronaut-pyronaut-bom"
        )
        if (includedMicronautCorePresent) {
            requireMavenVersionDir(
                targetRepository,
                "io/micronaut/micronaut-core/${micronautCoreVersion.get()}",
                "micronaut-core"
            )
            includedMicronautCoreArtifactIds.findAll { it != "micronaut-core-bom" }.each { artifactId ->
                requireMavenArtifactFile(
                    targetRepository,
                    "io/micronaut/${artifactId}/${micronautCoreVersion.get()}",
                    "${artifactId}-${micronautCoreVersion.get()}.jar"
                )
            }
        }
        if (System.getProperty("pyronaut.graalpy.bundle.repo") != null) {
            requireMavenVersionDir(
                targetRepository,
                "org/graalvm/python/python-embedding/${graalPyVersion.get()}",
                "python-embedding"
            )
            requireMavenArtifactFile(
                targetRepository,
                "org/graalvm/python/python-embedding/${graalPyVersion.get()}",
                "python-embedding-${graalPyVersion.get()}.jar"
            )
            requireMavenVersionDir(
                targetRepository,
                "org/graalvm/python/python-embedding-tools/${graalPyVersion.get()}",
                "python-embedding-tools"
            )
            requireMavenArtifactFile(
                targetRepository,
                "org/graalvm/python/python-embedding-tools/${graalPyVersion.get()}",
                "python-embedding-tools-${graalPyVersion.get()}.jar"
            )
        }
        logger.lifecycle("Prepared SDK Maven local environment at ${targetRepository.absolutePath}")
    }
}

tasks.register("prepareWheelSources", Sync) {
    from("src/main/python") {
        into("src")
    }
    into(wheelStagingDir)

    delegatedCliProjects.each { cliProject ->
        dependsOn(project(cliProject.path).tasks.named("installDist"))
        def installDirName = cliProject.containsKey("installDir") ? cliProject.installDir : project(cliProject.path).name
        from(project(cliProject.path).layout.buildDirectory.dir("install/${installDirName}")) {
            into("src/pyronaut_cli_v2/tools/${cliProject.command}")
            if (nativeSdkWheel.get()) {
                exclude(nativeWheelExcludedJars)
            }
        }
    }
    inputs.property("native", nativeSdkWheel)

    if (nativeSdkWheel.get()) {
        delegatedNativeCliProjects.each { cliProject ->
            def nativeCompileTask = project(cliProject.path).tasks.named("nativeCompile")
            dependsOn(nativeCompileTask)
            from(nativeCompileTask.map { it.outputFile.get().asFile }) {
                into("src/pyronaut_cli_v2/tools/${cliProject.command}/native")
            }
        }
    }

    doLast {
        delegatedCliProjects.each { cliProject ->
            def sourceCommand = cliProject.containsKey("sourceCommand") ? cliProject.sourceCommand : cliProject.command
            if (sourceCommand != cliProject.command) {
                def sourceScript = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${sourceCommand}").asFile
                def targetScript = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${cliProject.command}").asFile
                if (sourceScript.exists() && !targetScript.exists()) {
                    sourceScript.renameTo(targetScript)
                }
                def sourceBat = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${sourceCommand}.bat").asFile
                def targetBat = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${cliProject.command}.bat").asFile
                if (sourceBat.exists() && !targetBat.exists()) {
                    sourceBat.renameTo(targetBat)
                }
            }
        }

        if (nativeSdkWheel.get()) {
            delete(fileTree(wheelStagingDir).matching {
                include(nativeWheelExcludedJars)
            })
            delegatedNativeCliProjects.each { cliProject ->
                def nativeBinary = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/native/${cliProject.command}").asFile
                if (nativeBinary.exists()) {
                    nativeBinary.setExecutable(true)
                }
                def nativeProvidedClasspath = project(cliProject.path).configurations.nativeImageClasspath.files
                    .collect { it.name }
                    .unique()
                    .sort()
                    .join(System.lineSeparator())
                def nativeProvidedFile = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/native/native-provided-classpath.txt").asFile
                nativeProvidedFile.parentFile.mkdirs()
                nativeProvidedFile.text = nativeProvidedClasspath + System.lineSeparator()
            }
        }

        def toolchainDefaultsFile = wheelStagingDir.get().file("src/pyronaut_cli_v2/toolchain-defaults.properties").asFile
        if (graalVmDevTag.present) {
            def configuredTag = graalVmDevTag.get().trim()
            toolchainDefaultsFile.text = """
distribution=${graalVmDistributionForTag(configuredTag)}
java-version=${graalVmJavaVersionForTag(configuredTag)}
release-tag=${configuredTag}
""".trim() + System.lineSeparator()
        } else {
            toolchainDefaultsFile.delete()
        }

        def pyprojectFile = wheelStagingDir.get().file("pyproject.toml").asFile
        pyprojectFile.parentFile.mkdirs()
        pyprojectFile.text = """
[project]
name = "pyronaut"
version = "${wheelVersion.get()}"
description = "Pyronaut v2 SDK orchestrator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pyronaut = "pyronaut_cli_v2.cli:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
pyronaut_cli_v2 = ["tools/**", "toolchain-defaults.properties"]
""".trim() + System.lineSeparator()

        def setupCfgFile = wheelStagingDir.get().file("setup.cfg").asFile
        setupCfgFile.text = """
[metadata]
name = pyronaut
version = ${wheelVersion.get()}
description = Pyronaut v2 SDK orchestrator

[options]
package_dir =
    = src
packages = find:
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
pyronaut_cli_v2 =
    toolchain-defaults.properties
    tools/*
    tools/*/*
    tools/*/*/*
    tools/*/*/*/*

[options.entry_points]
console_scripts =
    pyronaut = pyronaut_cli_v2.cli:main

[bdist_wheel]
root_is_pure = false
""".trim() + System.lineSeparator()
    }
}

tasks.register("buildSdkWheel", Exec) {
    group = "build"
    description = "Builds the Pyronaut SDK wheel. Use -Pnative=true to include native launchers."
    dependsOn(tasks.named("prepareWheelSources"))
    inputs.dir(wheelStagingDir)
    inputs.property("native", nativeSdkWheel)
    outputs.dir(wheelDistDir)
    doFirst {
        delete(wheelDistDir)
        delete(wheelStagingDir.get().dir("build"))
        delete(fileTree(wheelStagingDir).matching {
            include("src/*.egg-info")
        })
    }
    commandLine(
        "python3",
        "-m",
        "pip",
        "wheel",
        "--no-deps",
        "--wheel-dir",
        wheelDistDir.get().asFile.absolutePath,
        wheelStagingDir.get().asFile.absolutePath
    )
}

tasks.register("installSdkWheel", Exec) {
    group = "build"
    description = "Builds and installs the Pyronaut SDK wheel with pyenv/pip. Use -Pnative=true to include native launchers."
    dependsOn(tasks.named("buildSdkWheel"))
    dependsOn(tasks.named("prepareSdkMavenLocalEnvironment"))
    inputs.dir(wheelDistDir)
    inputs.property("native", nativeSdkWheel)
    inputs.property("pyenvVersion", pyenvVersion)
    doFirst {
        def wheels = fileTree(wheelDistDir).matching {
            include("pyronaut-*.whl")
        }.files.sort { it.name }
        if (wheels.size() != 1) {
            throw new GradleException("Expected exactly one Pyronaut SDK wheel in ${wheelDistDir.get().asFile.absolutePath}, found ${wheels.size()}")
        }
        commandLine(
            "pyenv",
            "exec",
            "python",
            "-m",
            "pip",
            "install",
            "--force-reinstall",
            wheels.first().absolutePath
        )
        environment("PYENV_VERSION", pyenvVersion.get())
    }
}

