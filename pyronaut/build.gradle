    environment("PYRONAUT_E2E_MYSQL", "false")
    environment("PYRONAUT_E2E_PYTHON", "python3")
    environment(
        "PYRONAUT_DEV_EXECUTABLE",
        project(":micronaut-pyronaut-dev").layout.buildDirectory.file("install/micronaut-pyronaut-dev/bin/pyronaut-dev").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_DEV_NATIVE_EXECUTABLE",
        project(":micronaut-pyronaut-dev").layout.buildDirectory.file("install/micronaut-pyronaut-dev/bin/pyronaut-dev").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_INSTALL_EXECUTABLE",
        project(":micronaut-pyronaut-install").layout.buildDirectory.file("install/micronaut-pyronaut-install/bin/pyronaut-install").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_PROCESSOR_EXECUTABLE",
        project(":micronaut-pyronaut-processor").layout.buildDirectory.file("install/micronaut-pyronaut-processor/bin/pyronaut-processor").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_RUN_EXECUTABLE",
        project(":micronaut-pyronaut-run").layout.buildDirectory.file("install/micronaut-pyronaut-run/bin/pyronaut-run").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_RUN_PYTHON_EXECUTABLE",
        project(":micronaut-pyronaut-run-python").layout.buildDirectory.file("install/micronaut-pyronaut-run-python/bin/pyronaut-run-python").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_EXECUTABLE",
        project(":micronaut-pyronaut-test").layout.buildDirectory.file("install/micronaut-pyronaut-test/bin/pyronaut-test").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_VALIDATE_CONFIG_EXECUTABLE",
        project(":micronaut-pyronaut-validate-config").layout.buildDirectory.file("install/micronaut-pyronaut-validate-config/bin/pyronaut-validate-config").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_RESOURCES_SERVER_EXECUTABLE",
        project(":micronaut-pyronaut-test-resources-server").layout.buildDirectory.file("install/micronaut-pyronaut-test-resources-server/bin/pyronaut-test-resources-server").get().asFile.absolutePath
    )
    doFirst {
        environment("PYRONAUT_E2E_FIXTURE_DIR", e2eFixtureDir.get().asFile.absolutePath)
        // Other fixture builds in the same Gradle run cache the same SNAPSHOTs in
        // ~/.m2 under different repository ids, which Maven Resolver then refuses
        // to serve ("present, but unavailable"). Give the e2e fixture its own.
        environment("PYRONAUT_LOCAL_REPOSITORY", e2eLocalRepositoryDir.get().asFile.absolutePath)
        if (graalVmHomeProvider.present) {
            def graalVmHome = graalVmHomeProvider.get()
            PyronautGraalVmDevBuilds.ensureNativeImageLauncherIsUsable(file(graalVmHome))
            PyronautGraalVmDevBuilds.ensureMacOsGatekeeperDoesNotBlock(file(graalVmHome))
            environment("JAVA_HOME", graalVmHome)
            environment("PATH", graalVmHome + "/bin" + File.pathSeparator + System.getenv("PATH"))
        }
    }
}

