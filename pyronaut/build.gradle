tasks.register("preparePythonOrchestratorE2EFixture", Sync) {
    group = "build setup"
    description = "Prepares the Python orchestrator e2e fixture with locally staged snapshot artifacts"
    dependsOn(project(":micronaut-functional-test").tasks.named("publishFixtureArtifactsToMavenLocal"))
    from(e2eFixtureSourceDir)
    into(e2eFixtureDir)
    inputs.dir(e2eFixtureRepositoryDir)
    inputs.property("e2eFixtureRepository", e2eFixtureRepositoryDir.map { it.asFile.absolutePath })
    doLast {
        def repositoryDir = e2eFixtureRepositoryDir.get().asFile
        if (!repositoryDir.isDirectory()) {
            throw new GradleException("Missing staged e2e fixture repository: ${repositoryDir.absolutePath}")
        }
        def pyprojectFile = e2eFixtureDir.get().file("pyproject.toml").asFile
        def content = pyprojectFile.getText("UTF-8")
        def marker = "repositories = [\n"
        if (!content.contains(marker)) {
            throw new GradleException("Unexpected e2e pyproject fixture format: ${pyprojectFile.absolutePath}")
        }
        def repository = repositoryDir.absolutePath.replace("\\", "\\\\").replace("\"", "\\\"")
        def repositoryEntry = "  \"${repository}\",\n"
        if (!content.contains(repositoryEntry)) {
            pyprojectFile.setText(content.replace(marker, marker + repositoryEntry), "UTF-8")
        }
    }
}

