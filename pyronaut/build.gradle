tasks.register("buildSdkWheel", Exec) {
    group = "build"
    description = "Builds the JVM-based Pyronaut SDK wheel."
    dependsOn(tasks.named("prepareWheelSources"))
    inputs.dir(wheelStagingDir)
    outputs.dir(wheelDistDir)
    doFirst {
        // GraalPy's pip appends an unrecorded GRAALPY_MARKER after building.
        // This platform-independent SDK wheel needs no GraalPy package patches.
        environment("PIP_GRAALPY_DISABLE_PATCHING", "true")
        // Prefer the configured pyenv interpreter, but allow environments
        // without pyenv to build with the system Python.
        if (usesPyenv.get()) {
            environment("PYENV_VERSION", pyenvVersion.get())
        }
        delete(wheelDistDir)
        delete(wheelStagingDir.get().dir("build"))
        delete(fileTree(wheelStagingDir).matching {
            include("src/*.egg-info")
        })
    }
    commandLine(
        *pythonCommand.get(),
        "-m",
        "pip",
        "wheel",
        "--no-deps",
        "--wheel-dir",
        wheelDistDir.get().asFile.absolutePath,
        wheelStagingDir.get().asFile.absolutePath
    )
    doLast {
        def wheels = fileTree(wheelDistDir).matching { include("pyronaut-*.whl") }.files
        if (wheels.size() != 1) {
            throw new GradleException("Expected exactly one Pyronaut SDK wheel, found ${wheels.size()}")
        }
        def wheel = wheels.first()
        if (wheel.length() >= 100_000_000L) {
            throw new GradleException("Pyronaut SDK wheel exceeds the PyPI 100 MB limit: ${wheel.length()} bytes")
        }
        def descriptorFiles = fileTree(wheelStagingDir.get().dir("src/pyronaut_cli_v2/tools")).matching {
            include("*/bin/pyronaut-tool-classpath.tsv")
        }.files
        if (descriptorFiles.size() != delegatedCliProjects.size()) {
            throw new GradleException(
                "Expected ${delegatedCliProjects.size()} tool dependency descriptors, found ${descriptorFiles.size()}"
            )
        }
        def externalArtifactNames = [] as Set
        def controlPanelArtifactNames = [] as Set
        def bundledArtifactNames = [] as Set
        descriptorFiles.each { descriptor ->
            descriptor.eachLine("UTF-8") { line ->
                def fields = line.split("\\t", -1)
                if (fields[0] == "bundled") {
                    bundledArtifactNames.add(fields[1])
                } else if (fields[0] == "control-panel") {
                    controlPanelArtifactNames.add(fields[6])
                } else if (fields[0] == "maven") {
                    externalArtifactNames.add(fields[6])
                }
            }
        }
        def packagedArtifactNames = zipTree(wheel).matching {
            include("**/tools/shared/lib/*")
            include("**/tools/*/lib/control-panel/*")
        }.files.collect { it.name } as Set
        // The installer bootstrap retains its complete classpath in the wheel,
        // while the other tools resolve those same external artifacts from the
        // selected Maven repository. Those shared bootstrap files are not the
        // runtime versions used by the installed tool cache.
        def unexpectedExternalArtifacts = packagedArtifactNames.intersect(
            externalArtifactNames - bundledArtifactNames - controlPanelArtifactNames
        )
        if (!unexpectedExternalArtifacts.isEmpty()) {
            throw new GradleException("Wheel contains externally resolved tool artifacts: ${unexpectedExternalArtifacts.sort()}")
        }
        def missingBundledArtifacts = bundledArtifactNames - packagedArtifactNames
        if (!missingBundledArtifacts.isEmpty()) {
            throw new GradleException("Wheel is missing required bootstrap artifacts: ${missingBundledArtifacts.sort()}")
        }
        // Recurse only into Pyronaut-owned JARs. External dependencies are
        // published artifacts and may contain legitimate sample paths.
        def ownedJarNames = packagedArtifactNames
            .findAll { it.startsWith("micronaut-pyronaut-") && it.endsWith(".jar") }
            .sort()
        // Do not reject the entire user home: third-party class files can
        // legitimately contain sample paths such as /home/joe/project.
        def forbiddenPaths = [
            rootProject.projectDir.canonicalPath,
            wheelStagingDir.get().asFile.canonicalPath,
            gradle.gradleUserHomeDir.canonicalPath,
            new File(gradle.gradleUserHomeDir, "caches").canonicalPath,
        ].unique()
        def auditCommand = []
        auditCommand.addAll(pythonCommand.get())
        auditCommand.add(file("src/main/python/pyronaut_cli_v2/wheel_audit.py").absolutePath)
        ownedJarNames.each { jarName ->
            auditCommand.add("--owned-jar")
            auditCommand.add(jarName)
        }
        auditCommand.add(wheel.absolutePath)
        auditCommand.addAll(forbiddenPaths)
        def auditProcessBuilder = new ProcessBuilder(auditCommand)
            .redirectErrorStream(true)
        if (usesPyenv.get()) {
            auditProcessBuilder.environment().put("PYENV_VERSION", pyenvVersion.get())
        }
        def auditProcess = auditProcessBuilder.start()
        def auditOutput = auditProcess.inputStream.getText("UTF-8").trim()
        def auditExit = auditProcess.waitFor()
        if (auditExit != 0) {
            def diagnostic = auditOutput ?: "the audit produced no diagnostic"
            throw new GradleException("Pyronaut SDK wheel audit failed: ${diagnostic}")
        }
        logger.lifecycle("Verified Pyronaut SDK wheel size: ${wheel.length()} bytes")
    }
}

tasks.register("installSdkWheel", Exec) {
    group = "build"
    description = "Builds and installs the JVM-based Pyronaut SDK wheel with pyenv/pip."
    dependsOn(tasks.named("buildSdkWheel"))
    dependsOn(tasks.named("prepareSdkMavenLocalEnvironment"))
    inputs.dir(wheelDistDir)
    inputs.property("pyenvVersion", pyenvVersion)
    doFirst {
        def wheels = fileTree(wheelDistDir).matching {
            include("pyronaut-*.whl")
        }.files.sort { it.name }
        if (wheels.size() != 1) {
            throw new GradleException("Expected exactly one Pyronaut SDK wheel in ${wheelDistDir.get().asFile.absolutePath}, found ${wheels.size()}")
        }
        commandLine(
            *(pythonCommand.get()),
            "-m",
            "pip",
            "install",
            "--force-reinstall",
            wheels.first().absolutePath
        )
        if (usesPyenv.get()) {
            environment("PYENV_VERSION", pyenvVersion.get())
        }
    }
}

tasks.register("testPythonOrchestrator", Exec) {
    group = "verification"
    description = "Runs Python tests for pyronaut orchestrator"
    commandLine("python3", "-m", "unittest", "discover", "-s", "src/test/python", "-p", "*_test.py")
    environment("PYTHONPATH", file("src/main/python").absolutePath)
    // Unit tests must not inherit a developer's active virtual environment or
    // JAVA_HOME; those values are inputs under test and make results host-dependent.
    doFirst {
        environment.remove("VIRTUAL_ENV")
        environment.remove("JAVA_HOME")
        environment.remove("PYRONAUT_DISABLE_AUTO_JAVA_HOME")
        // Keep credentials and release-discovery state out of unit tests. A
        // failing assertion can include the subprocess environment, and the
        // GitHub-release tests provide their own token fixtures explicitly.
        ["PYRONAUT_RELEASE_TOKEN", "PYRONAUT_GIT_TOKEN", "GH_TOKEN", "GITHUB_TOKEN", "GITHUB_API_TOKEN"].each {
            environment.remove(it)
        }
    }
}

// The e2e fixtures resolve through ~/.m2. Publishing into it while they resolve
// leaves half-written SNAPSHOT entries (jar without pom) that Maven Resolver
// rejects, so run the e2e tasks only after any publishToMavenLocal in the build.
def mavenLocalPublishingTasks = {
    rootProject.subprojects
        .collect { it.tasks.findByName("publishToMavenLocal") }
        .findAll { it != null }
}

tasks.register("preparePythonOrchestratorE2EFixture", Sync) {
    group = "build setup"
    description = "Prepares the Python orchestrator e2e fixture with locally staged snapshot artifacts"
    dependsOn(project(":micronaut-functional-test").tasks.named("publishFixtureArtifactsToMavenLocal"))
    from(e2eFixtureSourceDir)
    into(e2eFixtureDir)
    inputs.dir(e2eFixtureRepositoryDir)
    inputs.property("e2eFixtureRepository", e2eFixtureRepositoryDir.map { it.asFile.absolutePath })
    doLast {
        def repositoryDir = e2eFixtureRepositoryDir.get().asFile
        if (!repositoryDir.isDirectory()) {
            throw new GradleException("Missing staged e2e fixture repository: ${repositoryDir.absolutePath}")
        }
        def pyprojectFile = e2eFixtureDir.get().file("pyproject.toml").asFile
        def content = pyprojectFile.getText("UTF-8")
        def marker = "repositories = [\n"
        if (!content.contains(marker)) {
            throw new GradleException("Unexpected e2e pyproject fixture format: ${pyprojectFile.absolutePath}")
        }
        def repository = repositoryDir.absolutePath.replace("\\", "\\\\").replace("\"", "\\\"")
        def repositoryEntry = "  \"${repository}\",\n"
        if (!content.contains(repositoryEntry)) {
            pyprojectFile.setText(content.replace(marker, marker + repositoryEntry), "UTF-8")
        }
    }
}

