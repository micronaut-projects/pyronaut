plugins {
    id 'io.micronaut.build.internal.pyronaut-module'
}

def wheelStagingDir = layout.buildDirectory.dir("wheel/staging")
def wheelDistDir = layout.buildDirectory.dir("wheel/dist")
def wheelVersion = providers.provider {
    def configuredVersion = project.findProperty("projectVersion")?.toString() ?: project.version.toString()
    configuredVersion.replace("-SNAPSHOT", ".dev0")
}
def defaultGraalVmHome = "/Users/graemerocher/dev/oracle/graalvm-25.1.0-dev+10.1/Contents/Home"
def graalVmHomeProvider = providers.gradleProperty("pyronautGraalVmHome").orElse(defaultGraalVmHome)

def delegatedCliProjects = [
    [path: ":micronaut-pyronaut-install", command: "pyronaut-install"],
    [path: ":micronaut-pyronaut-processor", command: "pyronaut-processor"],
    [path: ":micronaut-pyronaut-run", command: "pyronaut-run"],
    [path: ":micronaut-pyronaut-test", command: "pyronaut-test"],
    [path: ":micronaut-pyronaut-native-build", command: "pyronaut-native-build"],
    [path: ":micronaut-pyronaut-validate-config", command: "pyronaut-validate-config"],
    [path: ":micronaut-pyronaut-test-resources-server", command: "pyronaut-test-resources-server"],
    [path: ":micronaut-pyronaut-tui", command: "pyronaut-tui", installDir: "pyronaut-tui"]
]
def delegatedNativeCliProjects = [
    [path: ":micronaut-pyronaut-install", command: "pyronaut-install"],
    [path: ":micronaut-pyronaut-processor", command: "pyronaut-processor"],
    [path: ":micronaut-pyronaut-validate-config", command: "pyronaut-validate-config"]
]

tasks.register("prepareWheelSources", Sync) {
    from("src/main/python") {
        into("src")
    }
    into(wheelStagingDir)

    delegatedCliProjects.each { cliProject ->
        dependsOn(project(cliProject.path).tasks.named("installDist"))
        def installDirName = cliProject.containsKey("installDir") ? cliProject.installDir : project(cliProject.path).name
        from(project(cliProject.path).layout.buildDirectory.dir("install/${installDirName}")) {
            into("src/pyronaut_cli_v2/tools/${cliProject.command}")
        }
    }
    delegatedNativeCliProjects.each { cliProject ->
        def nativeCompileTask = project(cliProject.path).tasks.named("nativeCompile")
        dependsOn(nativeCompileTask)
        from(nativeCompileTask.map { it.outputFile.get().asFile }) {
            into("src/pyronaut_cli_v2/tools/${cliProject.command}/native")
        }
    }

    doLast {
        delegatedCliProjects.each { cliProject ->
            def sourceCommand = cliProject.containsKey("sourceCommand") ? cliProject.sourceCommand : cliProject.command
            if (sourceCommand != cliProject.command) {
                def sourceScript = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${sourceCommand}").asFile
                def targetScript = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${cliProject.command}").asFile
                if (sourceScript.exists() && !targetScript.exists()) {
                    sourceScript.renameTo(targetScript)
                }
                def sourceBat = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${sourceCommand}.bat").asFile
                def targetBat = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${cliProject.command}.bat").asFile
                if (sourceBat.exists() && !targetBat.exists()) {
                    sourceBat.renameTo(targetBat)
                }
            }
        }

        delegatedNativeCliProjects.each { cliProject ->
            def nativeBinary = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/native/${cliProject.command}").asFile
            if (nativeBinary.exists()) {
                nativeBinary.setExecutable(true)
            }
        }

        def pyprojectFile = wheelStagingDir.get().file("pyproject.toml").asFile
        pyprojectFile.parentFile.mkdirs()
        pyprojectFile.text = """
[project]
name = "pyronaut"
version = "${wheelVersion.get()}"
description = "Pyronaut v2 SDK orchestrator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pyronaut = "pyronaut_cli_v2.cli:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
pyronaut_cli_v2 = ["tools/**"]
""".trim() + System.lineSeparator()

        def setupCfgFile = wheelStagingDir.get().file("setup.cfg").asFile
        setupCfgFile.text = """
[metadata]
name = pyronaut
version = ${wheelVersion.get()}
description = Pyronaut v2 SDK orchestrator

[options]
package_dir =
    = src
packages = find:
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
pyronaut_cli_v2 =
    tools/*
    tools/*/*
    tools/*/*/*
    tools/*/*/*/*

[options.entry_points]
console_scripts =
    pyronaut = pyronaut_cli_v2.cli:main

[bdist_wheel]
root_is_pure = false
""".trim() + System.lineSeparator()
    }
}

tasks.register("buildSdkWheel", Exec) {
    group = "build"
    description = "Builds the Pyronaut SDK wheel"
    dependsOn(tasks.named("prepareWheelSources"))
    inputs.dir(wheelStagingDir)
    outputs.dir(wheelDistDir)
    doFirst {
        delete(wheelDistDir)
    }
    commandLine(
        "python3",
        "-m",
        "pip",
        "wheel",
        "--no-deps",
        "--wheel-dir",
        wheelDistDir.get().asFile.absolutePath,
        wheelStagingDir.get().asFile.absolutePath
    )
}

tasks.register("testPythonOrchestrator", Exec) {
    group = "verification"
    description = "Runs Python tests for pyronaut orchestrator"
    commandLine("python3", "-m", "unittest", "discover", "-s", "src/test/python", "-p", "*_test.py")
    environment("PYTHONPATH", file("src/main/python").absolutePath)
}

tasks.register("testPythonOrchestratorE2E", Exec) {
    group = "verification"
    description = "Runs fast smoke orchestrator e2e checks"

    dependsOn(project(":micronaut-pyronaut-install").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-processor").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-run").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-test").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-validate-config").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-test-resources-server").tasks.named("installDist"))

    commandLine("python3", "-m", "unittest", "discover", "-s", "src/test/python", "-p", "e2e_flow_test.py")
    environment("PYTHONPATH", file("src/main/python").absolutePath)
    environment("PYRONAUT_E2E", "true")
    environment("PYRONAUT_E2E_FULL", "false")
    environment("PYRONAUT_E2E_MYSQL", "false")
    environment("PYRONAUT_E2E_PYTHON", "python3")
    environment("PYRONAUT_E2E_FIXTURE_DIR", file("src/test/resources/e2e-app").absolutePath)
    environment(
        "PYRONAUT_INSTALL_EXECUTABLE",
        project(":micronaut-pyronaut-install").layout.buildDirectory.file("install/micronaut-pyronaut-install/bin/pyronaut-install").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_PROCESSOR_EXECUTABLE",
        project(":micronaut-pyronaut-processor").layout.buildDirectory.file("install/micronaut-pyronaut-processor/bin/pyronaut-processor").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_RUN_EXECUTABLE",
        project(":micronaut-pyronaut-run").layout.buildDirectory.file("install/micronaut-pyronaut-run/bin/pyronaut-run").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_EXECUTABLE",
        project(":micronaut-pyronaut-test").layout.buildDirectory.file("install/micronaut-pyronaut-test/bin/pyronaut-test").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_VALIDATE_CONFIG_EXECUTABLE",
        project(":micronaut-pyronaut-validate-config").layout.buildDirectory.file("install/micronaut-pyronaut-validate-config/bin/pyronaut-validate-config").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_RESOURCES_SERVER_EXECUTABLE",
        project(":micronaut-pyronaut-test-resources-server").layout.buildDirectory.file("install/micronaut-pyronaut-test-resources-server/bin/pyronaut-test-resources-server").get().asFile.absolutePath
    )
    doFirst {
        def graalVmHome = graalVmHomeProvider.get()
        if (file(graalVmHome).exists()) {
            environment("JAVA_HOME", graalVmHome)
            environment("PATH", graalVmHome + "/bin" + File.pathSeparator + System.getenv("PATH"))
        }
    }
}

tasks.register("testPythonOrchestratorE2EFull", Exec) {
    group = "verification"
    description = "Runs full Docker-backed orchestrator e2e integration checks"

    dependsOn(project(":micronaut-pyronaut-install").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-processor").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-run").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-test").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-validate-config").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-test-resources-server").tasks.named("installDist"))

    commandLine("python3", "-m", "unittest", "discover", "-s", "src/test/python", "-p", "e2e_flow_test.py")
    environment("PYTHONPATH", file("src/main/python").absolutePath)
    environment("PYRONAUT_E2E", "true")
    environment("PYRONAUT_E2E_FULL", "true")
    environment("PYRONAUT_E2E_MYSQL", "true")
    environment("PYRONAUT_E2E_PYTHON", "python3")
    environment("PYRONAUT_E2E_FIXTURE_DIR", file("src/test/resources/e2e-app").absolutePath)
    environment(
        "PYRONAUT_INSTALL_EXECUTABLE",
        project(":micronaut-pyronaut-install").layout.buildDirectory.file("install/micronaut-pyronaut-install/bin/pyronaut-install").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_PROCESSOR_EXECUTABLE",
        project(":micronaut-pyronaut-processor").layout.buildDirectory.file("install/micronaut-pyronaut-processor/bin/pyronaut-processor").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_RUN_EXECUTABLE",
        project(":micronaut-pyronaut-run").layout.buildDirectory.file("install/micronaut-pyronaut-run/bin/pyronaut-run").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_EXECUTABLE",
        project(":micronaut-pyronaut-test").layout.buildDirectory.file("install/micronaut-pyronaut-test/bin/pyronaut-test").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_VALIDATE_CONFIG_EXECUTABLE",
        project(":micronaut-pyronaut-validate-config").layout.buildDirectory.file("install/micronaut-pyronaut-validate-config/bin/pyronaut-validate-config").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_RESOURCES_SERVER_EXECUTABLE",
        project(":micronaut-pyronaut-test-resources-server").layout.buildDirectory.file("install/micronaut-pyronaut-test-resources-server/bin/pyronaut-test-resources-server").get().asFile.absolutePath
    )
    doFirst {
        Process dockerProcess
        try {
            dockerProcess = new ProcessBuilder("docker", "info")
                .redirectErrorStream(true)
                .start()
        } catch (IOException e) {
            throw new GradleException(
                "Docker CLI is required for testPythonOrchestratorE2EFull (PYRONAUT_E2E_MYSQL=true). " +
                    "Ensure Docker is installed and available on PATH. Diagnostic: ${e.message}",
                e
            )
        }

        def dockerOutput = dockerProcess.inputStream.getText("UTF-8")
        def dockerExit = dockerProcess.waitFor()

        if (dockerExit != 0) {
            def dockerDiagnostic = dockerOutput.trim()
            if (dockerDiagnostic.isEmpty()) {
                dockerDiagnostic = "docker info exited with code ${dockerExit}"
            }
            throw new GradleException(
                "Docker daemon is required for testPythonOrchestratorE2EFull (PYRONAUT_E2E_MYSQL=true). " +
                    "Run 'docker info' and ensure Docker Desktop/daemon is running. " +
                    "Diagnostic: ${dockerDiagnostic}"
            )
        }

        def graalVmHome = graalVmHomeProvider.get()
        if (file(graalVmHome).exists()) {
            environment("JAVA_HOME", graalVmHome)
            environment("PATH", graalVmHome + "/bin" + File.pathSeparator + System.getenv("PATH"))
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("testPythonOrchestrator"))
    dependsOn(tasks.named("testPythonOrchestratorE2E"))
}

tasks.named("checkstyleMain") {
    enabled = false
}

tasks.named("checkstyleTest") {
    enabled = false
}

tasks.named("assemble") {
    dependsOn(tasks.named("buildSdkWheel"))
}
