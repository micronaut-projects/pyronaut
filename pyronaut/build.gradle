import io.micronaut.pyronaut.gradle.PyronautGraalVmDevBuilds
import org.gradle.api.GradleException
import java.nio.file.Files
import java.util.regex.Pattern

plugins {
    id 'io.micronaut.build.internal.pyronaut-module'
}

def wheelStagingDir = layout.buildDirectory.dir("wheel/staging")
def wheelDistDir = layout.buildDirectory.dir("wheel/dist")
def e2eFixtureSourceDir = layout.projectDirectory.dir("src/test/resources/e2e-app")
def e2eFixtureDir = layout.buildDirectory.dir("e2e-fixture/app")
def e2eFixtureRepositoryDir = project(":micronaut-functional-test").layout.buildDirectory.dir("fixture-repo")
def wheelVersion = providers.provider {
    def configuredVersion = project.findProperty("projectVersion")?.toString() ?: project.version.toString()
    configuredVersion.replace("-SNAPSHOT", ".dev0")
}
def graalVmDevTag = providers.gradleProperty("pyronautGraalVmDevTag")
def dockerEnabled = providers.gradleProperty("docker").map { it.toBoolean() }.orElse(false)
def graalVmProvisionTask = graalVmDevTag.present ? PyronautGraalVmDevBuilds.registerProvisionTask(rootProject, graalVmDevTag) : null
def graalVmToolchainHomeProvider = PyronautGraalVmDevBuilds.javaHomeProvider(project, graalVmDevTag)
    .map { it.absolutePath }
def graalVmHomeProvider = providers.gradleProperty("pyronautGraalVmHome").orElse(graalVmToolchainHomeProvider)
def buildJdkVersion = providers.provider {
    project.extensions.getByType(org.gradle.api.plugins.JavaPluginExtension).toolchain.languageVersion.get().asInt().toString()
}
def nativeImageJdkVersion = graalVmDevTag.map { tag ->
    def matcher = tag.trim() =~ /(\d+)/
    matcher.find() ? matcher.group(1) : buildJdkVersion.get()
}.orElse(buildJdkVersion)
def pyenvVersion = providers.gradleProperty("pyronautPyenvVersion").orElse("graalpy-25.0.3")
def pyenvExecutable = providers.provider {
    def pyenvRoot = System.getenv("PYENV_ROOT")
    def configured = pyenvRoot == null || pyenvRoot.isBlank()
        ? new File(System.getProperty("user.home"), ".pyenv/bin/pyenv")
        : new File(pyenvRoot, "bin/pyenv")
    if (configured.isFile() && configured.canExecute()) {
        return configured.absolutePath
    }
    def pathEntry = (System.getenv("PATH") ?: "").split(Pattern.quote(File.pathSeparator))
        .collect { new File(it, "pyenv") }
        .find { it.isFile() && it.canExecute() }
    pathEntry?.absolutePath ?: ""
}
def usesPyenv = pyenvExecutable.map { !it.isEmpty() }
def pythonCommand = pyenvExecutable.map { it ? [it, "exec", "python"] : ["python3"] }
def versionFromCatalog = { String key ->
    def catalogFile = rootProject.layout.projectDirectory.file("gradle/libs.versions.toml").asFile
    def matcher = catalogFile.getText("UTF-8") =~ /(?m)^${Pattern.quote(key)}\s*=\s*"([^"]+)"/
    if (!matcher.find()) {
        throw new GradleException("Unable to find version '${key}' in ${catalogFile.absolutePath}")
    }
    matcher.group(1)
}
def requiredGradleProperty = { String name ->
    providers.gradleProperty(name).orElse(providers.provider {
        throw new GradleException("Missing Gradle property '${name}'")
    })
}
def micronautCoreVersion = requiredGradleProperty("pyronaut.micronaut.core.version")
def graalPyVersion = providers.provider { versionFromCatalog("graalpy") }
def effectiveMavenLocalRepositoryDir = providers.provider {
    def configured = System.getProperty("maven.repo.local")
    if (configured == null || configured.isBlank()) {
        return new File(System.getProperty("user.home"), ".m2/repository")
    }
    file(configured)
}
def sdkMavenLocalRepositoryDir = providers.gradleProperty("pyronaut.sdk.mavenLocalRepository")
    .map { file(it) }
    .orElse(providers.provider { new File(System.getProperty("user.home"), ".m2/repository") })

def delegatedCliProjects = [
    [path: ":micronaut-pyronaut-install", command: "pyronaut-install"],
    [path: ":micronaut-pyronaut-processor", command: "pyronaut-processor"],
    [path: ":micronaut-pyronaut-dev", command: "pyronaut-dev"],
    [path: ":micronaut-pyronaut-run", command: "pyronaut-run"],
    [path: ":micronaut-pyronaut-run-python", command: "pyronaut-run-python"],
    [path: ":micronaut-pyronaut-test", command: "pyronaut-test"],
    [path: ":micronaut-pyronaut-create-app", command: "pyronaut-create"],
    [path: ":micronaut-pyronaut-native-build", command: "pyronaut-native-build"],
    [path: ":micronaut-pyronaut-validate-config", command: "pyronaut-validate-config"],
    [path: ":micronaut-pyronaut-test-resources-server", command: "pyronaut-test-resources-server"],
    [path: ":micronaut-pyronaut-tui", command: "pyronaut-tui", installDir: "pyronaut-tui"]
]
def mavenVersionDirReady = { File versionDir, String artifactId ->
    if (!versionDir.isDirectory()) {
        return false
    }
    if (new File(versionDir, "maven-metadata.xml").isFile() || new File(versionDir, "maven-metadata-local.xml").isFile()) {
        return true
    }
    if (new File(versionDir, "${artifactId}-${versionDir.name}.pom").isFile()) {
        return true
    }
    def files = versionDir.listFiles()
    files != null && files.any { it.isFile() && (it.name.endsWith(".pom") || it.name.endsWith(".jar")) }
}
def requireMavenVersionDir = { File repositoryDir, String relativePath, String artifactId ->
    def versionDir = new File(repositoryDir, relativePath)
    if (!mavenVersionDirReady(versionDir, artifactId)) {
        throw new GradleException("Expected ${artifactId} artifacts in ${versionDir.absolutePath}")
    }
}
def requireMavenArtifactFile = { File repositoryDir, String relativePath, String fileName ->
    def artifactFile = new File(new File(repositoryDir, relativePath), fileName)
    if (!artifactFile.isFile()) {
        throw new GradleException("Expected Maven artifact file: ${artifactFile.absolutePath}")
    }
}
def graalVmDistributionForTag = { String tag ->
    tag ==~ /(?:jdk-)?\d+e\d+-.+/ ? "ee" : "dev"
}
def graalVmJavaVersionForTag = { String tag ->
    def matcher = tag =~ /(\d+)/
    matcher.find() ? matcher.group(1) : "25"
}

tasks.register("prepareSdkMavenLocalEnvironment") {
    group = "build setup"
    description = "Publishes local Pyronaut artifacts to the Maven local repository used by demo applications."
    dependsOn({
        rootProject.subprojects
            .collect { it.tasks.findByName("publishToMavenLocal") }
            .findAll { it != null }
    })
    inputs.property("micronautCoreVersion", micronautCoreVersion)
    inputs.property("pyronautVersion", providers.provider { project.version.toString() })
    inputs.dir(effectiveMavenLocalRepositoryDir).optional()
    outputs.dir(sdkMavenLocalRepositoryDir)
    outputs.upToDateWhen { false }
    doLast {
        def sourceRepository = effectiveMavenLocalRepositoryDir.get().canonicalFile
        def targetRepository = sdkMavenLocalRepositoryDir.get().canonicalFile
        if (!sourceRepository.isDirectory()) {
            throw new GradleException("Missing effective Maven local repository: ${sourceRepository.absolutePath}")
        }
        targetRepository.mkdirs()

        if (sourceRepository != targetRepository) {
            def relativePaths = ["io/micronaut/pyronaut"]
            relativePaths.unique().each { relativePath ->
                def sourceDir = new File(sourceRepository, relativePath)
                if (sourceDir.isDirectory()) {
                    copy {
                        from(sourceDir)
                        into(new File(targetRepository, relativePath))
                    }
                }
            }
        }

        requireMavenVersionDir(
            targetRepository,
            "io/micronaut/pyronaut/micronaut-pyronaut-bom/${project.version}",
            "micronaut-pyronaut-bom"
        )
        logger.lifecycle("Prepared SDK Maven local environment at ${targetRepository.absolutePath}")
    }
}

tasks.register("prepareWheelSources", Sync) {
    // The SDK embeds only JVM launcher distributions. Keep them fresh whenever
    // the wheel is rebuilt so runtime fixes are not masked by stale output.
    dependsOn(project(":micronaut-pyronaut-run").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-run-python").tasks.named("installDist"))
    from("src/main/python") {
        into("src")
    }
    into(wheelStagingDir)

    delegatedCliProjects.each { cliProject ->
        dependsOn(project(cliProject.path).tasks.named("installDist"))
        def installDirName = cliProject.containsKey("installDir") ? cliProject.installDir : project(cliProject.path).name
        from(project(cliProject.path).layout.buildDirectory.dir("install/${installDirName}")) {
            into("src/pyronaut_cli_v2/tools/${cliProject.command}")
        }
    }

    doLast {
        delegatedCliProjects.each { cliProject ->
            def sourceCommand = cliProject.containsKey("sourceCommand") ? cliProject.sourceCommand : cliProject.command
            if (sourceCommand != cliProject.command) {
                def sourceScript = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${sourceCommand}").asFile
                def targetScript = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${cliProject.command}").asFile
                if (sourceScript.exists() && !targetScript.exists()) {
                    sourceScript.renameTo(targetScript)
                }
                def sourceBat = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${sourceCommand}.bat").asFile
                def targetBat = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools/${cliProject.command}/bin/${cliProject.command}.bat").asFile
                if (sourceBat.exists() && !targetBat.exists()) {
                    sourceBat.renameTo(targetBat)
                }
            }
        }

        // The individual Gradle distributions contain the same dependency
        // JARs repeatedly. Store one copy in a wheel-level shared directory,
        // while retaining per-tool manifests and launcher paths.
        def toolsRoot = wheelStagingDir.get().file("src/pyronaut_cli_v2/tools").asFile
        def sharedLib = new File(toolsRoot, "shared/lib")
        sharedLib.mkdirs()
        def sharedByName = [:]
        def sharedOrigins = [:].withDefault { [] }
        def originProjects = delegatedCliProjects.collectEntries { cliProject ->
            def command = cliProject.command
            [(command): cliProject.path]
        }
        toolsRoot.listFiles()?.findAll { it.isDirectory() && it.name != "shared" }.each { toolDir ->
            def classpathEntries = []
            def toolLib = new File(toolDir, "lib")
            if (toolLib.isDirectory()) {
                toolLib.listFiles()?.findAll { it.isFile() && (it.name.endsWith(".jar") || it.name.endsWith(".pom")) }.each { artifact ->
                    classpathEntries << artifact.name
                }
            }
            if (!classpathEntries.isEmpty()) {
                def manifest = new File(toolDir, "bin/pyronaut-classpath.txt")
                manifest.parentFile.mkdirs()
                manifest.text = classpathEntries.unique().sort().join(System.lineSeparator()) + System.lineSeparator()
            }

            [toolLib].each { sourceDir ->
                if (!sourceDir.isDirectory()) {
                    return
                }
                sourceDir.listFiles()?.findAll { it.isFile() && (it.name.endsWith(".jar") || it.name.endsWith(".pom")) }.each { artifact ->
                    if (artifact.name.endsWith(".jar")) {
                        def origin = originProjects[toolDir.name] ?: toolDir.name
                        sharedOrigins[artifact.name] << "${origin} (${artifact.absolutePath})"
                    }
                    def existing = sharedByName[artifact.name]
                    if (existing != null) {
                        if (Files.mismatch(existing.toPath(), artifact.toPath()) != -1L) {
                            throw new GradleException("Conflicting wheel artifacts have the same filename: ${artifact.name}")
                        }
                    } else {
                        def target = new File(sharedLib, artifact.name)
                        copy {
                            from(artifact)
                            into(sharedLib)
                        }
                        sharedByName[artifact.name] = target
                    }
                    artifact.delete()
                }
            }

            [new File(toolDir, "bin")].each { scriptDir ->
                if (scriptDir.isDirectory()) {
                    scriptDir.listFiles()?.findAll { it.isFile() && (it.name == toolDir.name || it.name == "${toolDir.name}.bat") }.each { script ->
                        def text = script.getText("UTF-8")
                        text = text.replace("\$APP_HOME/lib/", "\$APP_HOME/../shared/lib/")
                            .replace("%APP_HOME%\\lib\\", "%APP_HOME%\\..\\shared\\lib\\")
                        script.setText(text, "UTF-8")
                    }
                }
            }
        }

        def originReport = new File(toolsRoot, "shared/jar-origins.txt")
        originReport.text = sharedOrigins.keySet().sort().collect { jarName ->
            "${jarName}\t${sharedOrigins[jarName].unique().sort().join('; ')}"
        }.join(System.lineSeparator()) + System.lineSeparator()

        def toolchainDefaultsFile = wheelStagingDir.get().file("src/pyronaut_cli_v2/toolchain-defaults.properties").asFile
        if (graalVmDevTag.present) {
            def configuredTag = graalVmDevTag.get().trim()
            toolchainDefaultsFile.text = """
distribution=${graalVmDistributionForTag(configuredTag)}
java-version=${graalVmJavaVersionForTag(configuredTag)}
release-tag=${configuredTag}
""".trim() + System.lineSeparator()
        } else {
            toolchainDefaultsFile.delete()
        }

        def versionInfoFile = wheelStagingDir.get().file("src/pyronaut_cli_v2/version.properties").asFile
        versionInfoFile.parentFile.mkdirs()
        versionInfoFile.text = """pyronaut=${wheelVersion.get()}
micronaut.core=${micronautCoreVersion.get()}
micronaut.platform=${providers.gradleProperty("pyronaut.micronaut.platform.version").get()}
graalpy=${graalPyVersion.get()}
native-image.jdk=${nativeImageJdkVersion.get()}
"""

        def pyprojectFile = wheelStagingDir.get().file("pyproject.toml").asFile
        pyprojectFile.parentFile.mkdirs()
        pyprojectFile.text = """
[project]
name = "pyronaut"
version = "${wheelVersion.get()}"
description = "Pyronaut v2 SDK orchestrator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pyronaut = "pyronaut_cli_v2.cli:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
pyronaut_cli_v2 = ["tools/**", "tools/shared/lib/*", "toolchain-defaults.properties", "version.properties"]
""".trim() + System.lineSeparator()

        def setupCfgFile = wheelStagingDir.get().file("setup.cfg").asFile
        setupCfgFile.text = """
[metadata]
name = pyronaut
version = ${wheelVersion.get()}
description = Pyronaut v2 SDK orchestrator

[options]
package_dir =
    = src
packages = find:
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
pyronaut_cli_v2 =
    toolchain-defaults.properties
    version.properties
    tools/*
    tools/*/*
    tools/*/*/*
    tools/*/*/*/*
    tools/shared/lib/*

[options.entry_points]
console_scripts =
    pyronaut = pyronaut_cli_v2.cli:main

""".trim() + System.lineSeparator()

        def setupPyFile = wheelStagingDir.get().file("setup.py").asFile
        setupPyFile.delete()
    }
}

tasks.register("buildSdkWheel", Exec) {
    group = "build"
    description = "Builds the JVM-based Pyronaut SDK wheel."
    dependsOn(tasks.named("prepareWheelSources"))
    inputs.dir(wheelStagingDir)
    outputs.dir(wheelDistDir)
    doFirst {
        // Prefer the configured pyenv interpreter, but allow environments
        // without pyenv to build with the system Python.
        if (usesPyenv.get()) {
            environment("PYENV_VERSION", pyenvVersion.get())
        }
        delete(wheelDistDir)
        delete(wheelStagingDir.get().dir("build"))
        delete(fileTree(wheelStagingDir).matching {
            include("src/*.egg-info")
        })
    }
    commandLine(
        *pythonCommand.get(),
        "-m",
        "pip",
        "wheel",
        "--no-deps",
        "--wheel-dir",
        wheelDistDir.get().asFile.absolutePath,
        wheelStagingDir.get().asFile.absolutePath
    )
}

tasks.register("installSdkWheel", Exec) {
    group = "build"
    description = "Builds and installs the JVM-based Pyronaut SDK wheel with pyenv/pip."
    dependsOn(tasks.named("buildSdkWheel"))
    dependsOn(tasks.named("prepareSdkMavenLocalEnvironment"))
    inputs.dir(wheelDistDir)
    inputs.property("pyenvVersion", pyenvVersion)
    doFirst {
        def wheels = fileTree(wheelDistDir).matching {
            include("pyronaut-*.whl")
        }.files.sort { it.name }
        if (wheels.size() != 1) {
            throw new GradleException("Expected exactly one Pyronaut SDK wheel in ${wheelDistDir.get().asFile.absolutePath}, found ${wheels.size()}")
        }
        commandLine(
            *(pythonCommand.get()),
            "-m",
            "pip",
            "install",
            "--force-reinstall",
            wheels.first().absolutePath
        )
        if (usesPyenv.get()) {
            environment("PYENV_VERSION", pyenvVersion.get())
        }
    }
}

tasks.register("testPythonOrchestrator", Exec) {
    group = "verification"
    description = "Runs Python tests for pyronaut orchestrator"
    onlyIf {
        if (!dockerEnabled.get()) {
            logger.lifecycle("Skipping Python orchestrator tests: Docker/Test Resources require -Pdocker=true.")
        }
        dockerEnabled.get()
    }
    commandLine("python3", "-m", "unittest", "discover", "-s", "src/test/python", "-p", "*_test.py")
    environment("PYTHONPATH", file("src/main/python").absolutePath)
    // Unit tests must not inherit a developer's active virtual environment or
    // JAVA_HOME; those values are inputs under test and make results host-dependent.
    doFirst {
        environment.remove("VIRTUAL_ENV")
        environment.remove("JAVA_HOME")
        environment("PYRONAUT_DISABLE_AUTO_JAVA_HOME", "true")
    }
}

tasks.register("preparePythonOrchestratorE2EFixture", Sync) {
    group = "build setup"
    description = "Prepares the Python orchestrator e2e fixture with locally staged snapshot artifacts"
    dependsOn(project(":micronaut-functional-test").tasks.named("publishFixtureArtifactsToMavenLocal"))
    from(e2eFixtureSourceDir)
    into(e2eFixtureDir)
    inputs.dir(e2eFixtureRepositoryDir)
    inputs.property("e2eFixtureRepository", e2eFixtureRepositoryDir.map { it.asFile.absolutePath })
    doLast {
        def repositoryDir = e2eFixtureRepositoryDir.get().asFile
        if (!repositoryDir.isDirectory()) {
            throw new GradleException("Missing staged e2e fixture repository: ${repositoryDir.absolutePath}")
        }
        def pyprojectFile = e2eFixtureDir.get().file("pyproject.toml").asFile
        def content = pyprojectFile.getText("UTF-8")
        def marker = "repositories = [\n"
        if (!content.contains(marker)) {
            throw new GradleException("Unexpected e2e pyproject fixture format: ${pyprojectFile.absolutePath}")
        }
        def repository = repositoryDir.absolutePath.replace("\\", "\\\\").replace("\"", "\\\"")
        def repositoryEntry = "  \"${repository}\",\n"
        if (!content.contains(repositoryEntry)) {
            pyprojectFile.setText(content.replace(marker, marker + repositoryEntry), "UTF-8")
        }
    }
}

tasks.register("testPythonOrchestratorE2E", Exec) {
    group = "verification"
    description = "Runs fast smoke orchestrator e2e checks"
    onlyIf {
        if (!dockerEnabled.get()) {
            logger.lifecycle("Skipping orchestrator E2E: Docker/Test Resources require -Pdocker=true.")
        }
        dockerEnabled.get()
    }

    if (graalVmProvisionTask != null) {
        dependsOn(graalVmProvisionTask)
    }
    dependsOn(tasks.named("preparePythonOrchestratorE2EFixture"))
    dependsOn(project(":micronaut-pyronaut-install").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-dev").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-processor").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-run").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-test").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-validate-config").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-test-resources-server").tasks.named("installDist"))

    commandLine("python3", "-m", "unittest", "discover", "-s", "src/test/python", "-p", "e2e_flow_test.py")
    environment("PYTHONPATH", file("src/main/python").absolutePath)
    environment("PYRONAUT_E2E", "true")
    environment("PYRONAUT_E2E_FULL", "false")
    environment("PYRONAUT_E2E_MYSQL", "false")
    environment("PYRONAUT_E2E_PYTHON", "python3")
    environment(
        "PYRONAUT_DEV_NATIVE_EXECUTABLE",
        project(":micronaut-pyronaut-dev").layout.buildDirectory.file("install/micronaut-pyronaut-dev/bin/pyronaut-dev").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_INSTALL_EXECUTABLE",
        project(":micronaut-pyronaut-install").layout.buildDirectory.file("install/micronaut-pyronaut-install/bin/pyronaut-install").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_PROCESSOR_EXECUTABLE",
        project(":micronaut-pyronaut-processor").layout.buildDirectory.file("install/micronaut-pyronaut-processor/bin/pyronaut-processor").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_RUN_EXECUTABLE",
        project(":micronaut-pyronaut-run").layout.buildDirectory.file("install/micronaut-pyronaut-run/bin/pyronaut-run").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_EXECUTABLE",
        project(":micronaut-pyronaut-test").layout.buildDirectory.file("install/micronaut-pyronaut-test/bin/pyronaut-test").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_VALIDATE_CONFIG_EXECUTABLE",
        project(":micronaut-pyronaut-validate-config").layout.buildDirectory.file("install/micronaut-pyronaut-validate-config/bin/pyronaut-validate-config").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_RESOURCES_SERVER_EXECUTABLE",
        project(":micronaut-pyronaut-test-resources-server").layout.buildDirectory.file("install/micronaut-pyronaut-test-resources-server/bin/pyronaut-test-resources-server").get().asFile.absolutePath
    )
    doFirst {
        environment("PYRONAUT_E2E_FIXTURE_DIR", e2eFixtureDir.get().asFile.absolutePath)
        if (graalVmHomeProvider.present) {
            def graalVmHome = graalVmHomeProvider.get()
            PyronautGraalVmDevBuilds.ensureNativeImageLauncherIsUsable(file(graalVmHome))
            PyronautGraalVmDevBuilds.ensureMacOsGatekeeperDoesNotBlock(file(graalVmHome))
            environment("JAVA_HOME", graalVmHome)
            environment("PATH", graalVmHome + "/bin" + File.pathSeparator + System.getenv("PATH"))
        }
    }
}

tasks.register("testPythonOrchestratorExternalE2E", Exec) {
    group = "verification"
    description = "Runs opt-in Maven and Gradle external-build orchestrator e2e checks"

    if (graalVmProvisionTask != null) {
        dependsOn(graalVmProvisionTask)
    }
    dependsOn(project(":micronaut-pyronaut-install").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-processor").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-run").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-test").tasks.named("installDist"))

    commandLine("python3", "-m", "unittest", "discover", "-s", "src/test/python", "-p", "e2e_flow_test.py")
    environment("PYTHONPATH", file("src/main/python").absolutePath)
    environment("PYRONAUT_E2E", "true")
    environment("PYRONAUT_E2E_EXTERNAL", "true")
    environment("PYRONAUT_E2E_PYTHON", "python3")
    environment(
        "PYRONAUT_INSTALL_EXECUTABLE",
        project(":micronaut-pyronaut-install").layout.buildDirectory.file("install/micronaut-pyronaut-install/bin/pyronaut-install").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_PROCESSOR_EXECUTABLE",
        project(":micronaut-pyronaut-processor").layout.buildDirectory.file("install/micronaut-pyronaut-processor/bin/pyronaut-processor").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_RUN_EXECUTABLE",
        project(":micronaut-pyronaut-run").layout.buildDirectory.file("install/micronaut-pyronaut-run/bin/pyronaut-run").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_EXECUTABLE",
        project(":micronaut-pyronaut-test").layout.buildDirectory.file("install/micronaut-pyronaut-test/bin/pyronaut-test").get().asFile.absolutePath
    )
    doFirst {
        if (graalVmHomeProvider.present) {
            def graalVmHome = graalVmHomeProvider.get()
            PyronautGraalVmDevBuilds.ensureNativeImageLauncherIsUsable(file(graalVmHome))
            PyronautGraalVmDevBuilds.ensureMacOsGatekeeperDoesNotBlock(file(graalVmHome))
            environment("JAVA_HOME", graalVmHome)
            environment("PATH", graalVmHome + "/bin" + File.pathSeparator + System.getenv("PATH"))
        }
    }
}

tasks.register("testPythonOrchestratorE2EFull", Exec) {
    group = "verification"
    description = "Runs full Docker-backed orchestrator e2e integration checks"
    onlyIf {
        if (!dockerEnabled.get()) {
            logger.lifecycle("Skipping full orchestrator E2E: Docker/Test Resources require -Pdocker=true.")
        }
        dockerEnabled.get()
    }

    if (graalVmProvisionTask != null) {
        dependsOn(graalVmProvisionTask)
    }
    dependsOn(tasks.named("preparePythonOrchestratorE2EFixture"))
    dependsOn(project(":micronaut-pyronaut-install").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-dev").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-processor").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-run").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-test").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-validate-config").tasks.named("installDist"))
    dependsOn(project(":micronaut-pyronaut-test-resources-server").tasks.named("installDist"))

    commandLine("python3", "-m", "unittest", "discover", "-s", "src/test/python", "-p", "e2e_flow_test.py")
    environment("PYTHONPATH", file("src/main/python").absolutePath)
    environment("PYRONAUT_E2E", "true")
    environment("PYRONAUT_E2E_FULL", "true")
    environment("PYRONAUT_E2E_MYSQL", "true")
    environment("PYRONAUT_E2E_PYTHON", "python3")
    environment(
        "PYRONAUT_DEV_NATIVE_EXECUTABLE",
        project(":micronaut-pyronaut-dev").layout.buildDirectory.file("install/micronaut-pyronaut-dev/bin/pyronaut-dev").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_INSTALL_EXECUTABLE",
        project(":micronaut-pyronaut-install").layout.buildDirectory.file("install/micronaut-pyronaut-install/bin/pyronaut-install").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_PROCESSOR_EXECUTABLE",
        project(":micronaut-pyronaut-processor").layout.buildDirectory.file("install/micronaut-pyronaut-processor/bin/pyronaut-processor").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_RUN_EXECUTABLE",
        project(":micronaut-pyronaut-run").layout.buildDirectory.file("install/micronaut-pyronaut-run/bin/pyronaut-run").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_EXECUTABLE",
        project(":micronaut-pyronaut-test").layout.buildDirectory.file("install/micronaut-pyronaut-test/bin/pyronaut-test").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_VALIDATE_CONFIG_EXECUTABLE",
        project(":micronaut-pyronaut-validate-config").layout.buildDirectory.file("install/micronaut-pyronaut-validate-config/bin/pyronaut-validate-config").get().asFile.absolutePath
    )
    environment(
        "PYRONAUT_TEST_RESOURCES_SERVER_EXECUTABLE",
        project(":micronaut-pyronaut-test-resources-server").layout.buildDirectory.file("install/micronaut-pyronaut-test-resources-server/bin/pyronaut-test-resources-server").get().asFile.absolutePath
    )
    doFirst {
        environment("PYRONAUT_E2E_FIXTURE_DIR", e2eFixtureDir.get().asFile.absolutePath)
        Process dockerProcess
        try {
            dockerProcess = new ProcessBuilder("docker", "info")
                .redirectErrorStream(true)
                .start()
        } catch (IOException e) {
            throw new GradleException(
                "Docker CLI is required for testPythonOrchestratorE2EFull (PYRONAUT_E2E_MYSQL=true). " +
                    "Ensure Docker is installed and available on PATH. Diagnostic: ${e.message}",
                e
            )
        }

        def dockerOutput = dockerProcess.inputStream.getText("UTF-8")
        def dockerExit = dockerProcess.waitFor()

        if (dockerExit != 0) {
            def dockerDiagnostic = dockerOutput.trim()
            if (dockerDiagnostic.isEmpty()) {
                dockerDiagnostic = "docker info exited with code ${dockerExit}"
            }
            throw new GradleException(
                "Docker daemon is required for testPythonOrchestratorE2EFull (PYRONAUT_E2E_MYSQL=true). " +
                    "Run 'docker info' and ensure Docker Desktop/daemon is running. " +
                    "Diagnostic: ${dockerDiagnostic}"
            )
        }

        if (graalVmHomeProvider.present) {
            def graalVmHome = graalVmHomeProvider.get()
            PyronautGraalVmDevBuilds.ensureNativeImageLauncherIsUsable(file(graalVmHome))
            PyronautGraalVmDevBuilds.ensureMacOsGatekeeperDoesNotBlock(file(graalVmHome))
            environment("JAVA_HOME", graalVmHome)
            environment("PATH", graalVmHome + "/bin" + File.pathSeparator + System.getenv("PATH"))
        }
    }
}

