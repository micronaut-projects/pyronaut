name: Setup GraalPy pyenv virtual environment
description: Install GraalPy with pyenv and expose a GraalPy-backed virtualenv to Gradle.
inputs:
  graalpy-version:
    description: pyenv GraalPy version to install and activate.
    required: false
    default: graalpy3.13-25.4.4
  pytest-version:
    description: pytest version to install into the GraalPy virtual environment.
    required: false
    default: 9.0.3
  requests-version:
    description: Requests version for Python namespace compatibility tests.
    required: false
    default: 2.34.2
  venv-dir:
    description: Directory where the virtual environment should be created.
    required: false
    default: ${{ runner.temp }}/pyronaut-graalpy-venv
runs:
  using: composite
  steps:
    - name: Restore GraalPy pyenv cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.pyenv
          ${{ inputs.venv-dir }}
        key: ${{ runner.os }}-graalpy-pyenv-${{ inputs.graalpy-version }}-pytest-${{ inputs.pytest-version }}-requests-${{ inputs.requests-version }}

    - name: Create GraalPy virtualenv
      shell: bash
      run: |
        set -euo pipefail

        graalpy_version="${{ inputs.graalpy-version }}"
        pytest_version="${{ inputs.pytest-version }}"
        requests_version="${{ inputs.requests-version }}"
        venv_dir="${{ inputs.venv-dir }}"
        export PYENV_ROOT="${PYENV_ROOT:-$HOME/.pyenv}"
        export PATH="$PYENV_ROOT/bin:$PYENV_ROOT/shims:$PATH"

        if ! command -v pyenv >/dev/null 2>&1 && [ ! -x "$PYENV_ROOT/bin/pyenv" ]; then
          git clone --depth 1 https://github.com/pyenv/pyenv.git "$PYENV_ROOT"
        fi

        eval "$(pyenv init -)"
        pyenv install --skip-existing "$graalpy_version"
        pyenv rehash

        python_executable="$(PYENV_VERSION="$graalpy_version" pyenv which python)"
        venv_marker="$venv_dir/.pyronaut-graalpy-cache-marker"
        expected_marker="$graalpy_version pytest==$pytest_version requests==$requests_version"
        if [ ! -x "$venv_dir/bin/python" ] || [ ! -f "$venv_marker" ] || [ "$(cat "$venv_marker")" != "$expected_marker" ]; then
          rm -rf "$venv_dir"
          "$python_executable" -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --upgrade pip
          "$venv_dir/bin/python" -m pip install --no-compile "pytest==$pytest_version" "requests==$requests_version"
          echo "$expected_marker" > "$venv_marker"
        fi
        "$venv_dir/bin/python" -c "import sys; assert 'graal' in sys.version.lower(), sys.version; print(sys.version)"
        "$venv_dir/bin/python" -c "import pytest; print(pytest.__version__)"
        "$venv_dir/bin/python" -c "import requests; print(requests.__version__)"

        echo "PYENV_ROOT=$PYENV_ROOT" >> "$GITHUB_ENV"
        echo "PYENV_VERSION=$graalpy_version" >> "$GITHUB_ENV"
        echo "VIRTUAL_ENV=$venv_dir" >> "$GITHUB_ENV"
        echo "$venv_dir/bin" >> "$GITHUB_PATH"
        echo "$PYENV_ROOT/bin" >> "$GITHUB_PATH"
        echo "$PYENV_ROOT/shims" >> "$GITHUB_PATH"
