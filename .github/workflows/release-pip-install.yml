# Adds PyPI and GitHub-release installation choices to the release notes.
#
# Called by publish-python-release.yml once the wheel is attached to the
# release, and again with `pypi` once the same wheel is on PyPI. Run it by hand
# to rewrite the notes of an existing release.
name: Release pip install
on:
  workflow_call:
    inputs:
      release_tag:
        description: GitHub release tag to document, for example v0.0.4
        required: true
        type: string
      pypi:
        description: Also document the PyPI install command.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to document, for example v0.0.4
        required: true
        type: string
      pypi:
        description: Also document the PyPI install command (only if the version is on PyPI).
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  pip-install-notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Document installation choices
        run: |
          python3 .github/scripts/pip_install_notes.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            ${{ inputs.pypi && '--pypi' || '' }}
      - name: Verify installation from the GitHub release
        run: |
          set -euo pipefail
          if [[ "$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .private)" == "true" ]]; then
            echo "Repository is private; direct unauthenticated pip download is not available." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          version="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[] | select(.name | startswith("pyronaut-") and endswith(".whl")) | .name' \
            | sed -E 's/^pyronaut-([^-]+)-.*/\1/')"
          python3 -m venv "${RUNNER_TEMP}/pip-check"
          "${RUNNER_TEMP}/pip-check/bin/pip" download --no-deps --no-index \
            --find-links "https://github.com/${GITHUB_REPOSITORY}/releases/expanded_assets/${RELEASE_TAG}" \
            --dest "${RUNNER_TEMP}/pip-check/dist" \
            "pyronaut==${version}"
          echo "pip resolved pyronaut==${version} from the GitHub release." >> "${GITHUB_STEP_SUMMARY}"
