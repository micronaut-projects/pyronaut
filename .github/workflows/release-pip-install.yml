# Documents the pip install command for a release.
#
# Pyronaut is not published to PyPI yet, so the SDK wheel is attached to the
# GitHub release instead. pip installs it straight from the release page:
# `--find-links` accepts any HTML page and collects the distribution links it
# contains. The workflow waits for the wheel, then rewrites the install block
# in the release notes so the command always matches the published wheel.
name: Release pip install
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to document, for example v0.0.4
        required: true
        type: string
permissions:
  contents: write
jobs:
  pip-install-notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Document the pip install command
        run: |
          python3 .github/scripts/pip_install_notes.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${RELEASE_TAG}"
      - name: Verify the published install command
        # The command in the notes is only useful if pip can resolve the wheel
        # from the release page. Public releases are checked against the real
        # page; private ones cannot be read without credentials pip does not
        # have, so the check is reported as skipped.
        run: |
          set -euo pipefail
          if [[ "$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .private)" == "true" ]]; then
            echo "Repository is private; pip cannot read the release page anonymously." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          version="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[] | select(.name | startswith("pyronaut-") and endswith(".whl")) | .name' \
            | sed -E 's/^pyronaut-([^-]+)-.*/\1/')"
          python3 -m venv "${RUNNER_TEMP}/pip-check"
          "${RUNNER_TEMP}/pip-check/bin/pip" download --no-deps --no-index \
            --find-links "https://github.com/${GITHUB_REPOSITORY}/releases/expanded_assets/${RELEASE_TAG}" \
            --dest "${RUNNER_TEMP}/pip-check/dist" \
            "pyronaut==${version}"
          echo "pip resolved pyronaut==${version} from the release page." >> "${GITHUB_STEP_SUMMARY}"
