name: Build Crema container images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to package, for example v0.0.1-SNAPSHOT
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-crema-images:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Resolve release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+([.][0-9]+)*(-SNAPSHOT)?$ ]]; then
            echo "Unsupported release tag: ${RELEASE_TAG}"
            exit 1
          fi
          tag="v${version}"
          release_json="$(gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -c --arg tag "${tag}" 'add | map(select(.tag_name == $tag)) | first')"
          if [[ -z "${release_json}" || "${release_json}" == "null" ]]; then
            echo "Release ${tag} was not found"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          printf '%s' "${release_json}" > release.json

      - name: Download Crema release bundles
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p crema-context
          for runtime in run run-python; do
            for release_arch in amd64 aarch64; do
              if [[ "${release_arch}" == "amd64" ]]; then
                buildx_arch=amd64
              else
                buildx_arch=arm64
              fi
              asset="pyronaut-${runtime}-linux-${release_arch}-${VERSION}.tar.gz"
              asset_id="$(jq -r --arg name "${asset}" \
                '.assets[] | select(.name == $name) | .id' release.json)"
              if [[ -z "${asset_id}" || "${asset_id}" == "null" ]]; then
                echo "Release is missing ${asset}"
                exit 1
              fi
              context="crema-context/${runtime}"
              mkdir -p "${context}/bundles/${buildx_arch}"
              gh api \
                -H 'Accept: application/octet-stream' \
                "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "${context}/bundles/${buildx_arch}/bundle.tar.gz"
              tar -tzf "${context}/bundles/${buildx_arch}/bundle.tar.gz" > /dev/null
            done
          done

      - name: Write container definitions
        shell: bash
        run: |
          set -euo pipefail
          for runtime in run run-python; do
            cat > "crema-context/${runtime}/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM --platform=$BUILDPLATFORM alpine:3.22 AS unpack
          ARG TARGETARCH
          COPY bundles/ /bundles/
          RUN mkdir /out && tar -xzf "/bundles/${TARGETARCH}/bundle.tar.gz" -C /out

          FROM gcr.io/distroless/base-debian12
          WORKDIR /opt/pyronaut
          COPY --from=unpack /out/ /opt/pyronaut/bin/
          EOF
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Crema images
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image_owner="${GITHUB_REPOSITORY_OWNER,,}"
          for runtime in run run-python; do
            image="ghcr.io/${image_owner}/pyronaut-${runtime}:${VERSION}"
            docker buildx build \
              --file "crema-context/${runtime}/Dockerfile" \
              --platform linux/amd64,linux/arm64 \
              --tag "${image}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --push \
              "crema-context/${runtime}"
            echo "Published ${image}"
          done
