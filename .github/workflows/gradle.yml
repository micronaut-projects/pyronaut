# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: Java CI
on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+.x'
  pull_request:
    branches:
      - master
      - '[0-9]+.[0-9]+.x'
jobs:
  build:
    if: github.repository != 'micronaut-projects/micronaut-project-template'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25']
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
      DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
      DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
      GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      TESTCONTAINERS_RYUK_DISABLED: true
      PREDICTIVE_TEST_SELECTION: "${{ github.event_name == 'pull_request' && 'true' || 'false' }}"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
      OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}
    steps:
       # https://github.com/actions/virtual-environments/issues/709
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)
      - name: "🗑 Free disk space"
        run: |
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"
         sudo apt-get clean
         df -h

      - name: "📥 Checkout repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@v1.6.7
        with:
          distribution: 'graalvm'
          java-version: ${{ matrix.java }}
          version: '25.4'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup GraalPy pyenv virtualenv"
        uses: ./.github/actions/setup-graalpy-pyenv

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@v5
        with:
          # Saving the Gradle home takes up to a minute; pull requests reuse the branch caches
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper/dists
            jdks

      - name: "❓ Optional setup step"
        run: |
          [ -f ./setup.sh ] && ./setup.sh || [ ! -f ./setup.sh ]

      - name: "🚔 Sonatype Scan"
        if: env.OSS_INDEX_PASSWORD != '' && matrix.java == '25'
        id: sonatypescan
        run: |
          ./gradlew ossIndexAudit --no-parallel --info

      - name: "🛠 Build with Gradle"
        id: gradle
        run: |
          ./gradlew check jacocoReport --no-daemon --continue

      - name: "🔎 Run static analysis"
        if: env.SONAR_TOKEN != '' && matrix.java == '25'
        run: |
          ./gradlew sonar --no-parallel --continue

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Java CI / Test Report (${{ matrix.java }})
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_retries: 'true'

      - name: "📜 Upload binary compatibility check results"
        if: matrix.java == '25'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binary-compatibility-reports
          path: "**/build/reports/binary-compatibility-*.html"

      - name: "📦 Publish to Sonatype Snapshots"
        if: success() && github.event_name == 'push' && matrix.java == '25'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: ./gradlew publishToSonatype docs --no-daemon

      - name: "❓ Determine docs target repository"
        uses: haya14busa/action-cond@v1
        id: docs_target
        with:
          cond: ${{ github.repository == 'micronaut-projects/micronaut-core' }}
          if_true: "micronaut-projects/micronaut-docs"
          if_false: ${{ github.repository }}

      - name: "📑 Publish to Github Pages"
        if: success() && github.event_name == 'push' && matrix.java == '25'
        # The org-level GH_TOKEN secret is not shared with this private repository, so the
        # micronaut-projects/github-pages-deploy-action (which requires it) cannot be used.
        # Publish the snapshot docs with the workflow token instead.
        env:
          TARGET_REPOSITORY: ${{ steps.docs_target.outputs.value }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          BRANCH: gh-pages
          FOLDER: build/docs
        run: |
          set -euo pipefail
          REPOSITORY_URL="https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          PAGES_DIR="$RUNNER_TEMP/gh-pages"
          rm -rf "$PAGES_DIR"
          if git ls-remote --exit-code --heads "$REPOSITORY_URL" "$BRANCH" > /dev/null; then
            git clone --quiet --depth 1 --branch "$BRANCH" --single-branch "$REPOSITORY_URL" "$PAGES_DIR"
          else
            echo "Creating remote branch $BRANCH as it doesn't exist..."
            git init --quiet "$PAGES_DIR"
            git -C "$PAGES_DIR" checkout --quiet --orphan "$BRANCH"
            touch "$PAGES_DIR/.nojekyll"
          fi
          rm -rf "$PAGES_DIR/snapshot"
          mkdir -p "$PAGES_DIR/snapshot"
          cp -r "$FOLDER/." "$PAGES_DIR/snapshot/"
          cd "$PAGES_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Docs unchanged, nothing to publish."
            exit 0
          fi
          git commit --quiet -m "Deploying snapshot docs for ${GITHUB_SHA}"
          git push "$REPOSITORY_URL" "HEAD:$BRANCH"

      - name: "❓ Optional cleanup step"
        run: |
          [ -f ./cleanup.sh ] && ./cleanup.sh || [ ! -f ./cleanup.sh ]

  e2e-docker:
    if: github.repository != 'micronaut-projects/micronaut-project-template'
    # Docker-backed suites (Test Resources/MySQL); GitHub's Linux runners
    # provide a Docker engine, macOS runners do not.
    runs-on: ubuntu-latest
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
      DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
      DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
      GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      TESTCONTAINERS_RYUK_DISABLED: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "🗑 Free disk space"
        run: |
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"
         sudo apt-get clean
         df -h

      - name: "📥 Checkout repository"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@v1.6.7
        with:
          distribution: 'graalvm'
          java-version: '25'
          version: '25.4'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup GraalPy pyenv virtualenv"
        uses: ./.github/actions/setup-graalpy-pyenv

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper/dists
            jdks

      - name: "🧪 Run Docker-backed E2E and functional tests"
        run: |
          ./gradlew :micronaut-pyronaut:testPythonOrchestratorE2EFull :micronaut-functional-test-docker:test -Pdocker=true --no-daemon --continue
