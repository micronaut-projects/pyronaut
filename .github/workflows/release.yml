# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to package, for example v0.0.3
        required: true
        type: string
jobs:
  release:
    if: github.event_name == 'release'
    outputs:
      artifacts-sha256: ${{ steps.hash.outputs.artifacts-sha256 }} # Computed hashes for build artifacts.
    runs-on: ubuntu-latest
    steps:
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: gradle/actions/wrapper-validation@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Set the current release version
        id: release_version
        run: echo "release_version=${GITHUB_REF:11}" >> $GITHUB_OUTPUT
      - name: Run pre-release
        uses: micronaut-projects/github-actions/pre-release@master
        env:
          MICRONAUT_BUILD_EMAIL: ${{ secrets.MICRONAUT_BUILD_EMAIL }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to Sonatype OSSRH
        id: publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_FILE: ${{ secrets.GPG_FILE }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          PYRONAUT_GIT_TOKEN: ${{ secrets.PYRONAUT_GIT_TOKEN || secrets.GH_TOKEN }}
          PYRONAUT_GIT_USERNAME: ${{ secrets.PYRONAUT_GIT_USERNAME || secrets.GH_USERNAME || 'x-access-token' }}
          PYRONAUT_GRAALPY_BUNDLE_URL: ${{ secrets.PYRONAUT_GRAALPY_BUNDLE_URL }}
        run: |
          echo $GPG_FILE | base64 -d > secring.gpg
          # Publish both locally and to Sonatype.
          # The artifacts stored locally will be used to generate the SLSA provenance.
          ./gradlew publishToMavenCentral --publishing-type=AUTOMATIC
          # Read the current version from gradle.properties.
          VERSION=$(./gradlew properties | grep 'version:' | awk '{print $2}')
          # Read the project group from gradle.properties.
          GROUP_PATH=$(./gradlew properties| grep "projectGroup" | awk '{print $2}' | sed 's/\./\//g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "group=$GROUP_PATH" >> "$GITHUB_OUTPUT"
      - name: Generate subject
        id: hash
        run: |
          # Find the artifact JAR and POM files in the local repository.
          ARTIFACTS=$(find build/repo/${{ steps.publish.outputs.group }}/*/${{ steps.publish.outputs.version }}/* \
              -type f \( \( -iname "*.jar" -not -iname "*-javadoc.jar" -not -iname "*-sources.jar" \) -or -iname "*.pom" \))
          # Compute the hashes for the artifacts.
          # Set the hash as job output for debugging.
          echo "artifacts-sha256=$(sha256sum $ARTIFACTS | base64 -w0)" >> "$GITHUB_OUTPUT"
          # Store the hash in a file, which is uploaded as a workflow artifact.
          sha256sum $ARTIFACTS | base64 -w0 > artifacts-sha256
      - name: Upload build artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gradle-build-outputs
          path: build/repo/${{ steps.publish.outputs.group }}/*/${{ steps.publish.outputs.version }}/*
          retention-days: 5
      - name: Upload artifacts-sha256
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: artifacts-sha256
          path: artifacts-sha256
          retention-days: 5
      - name: Generate docs
        run: ./gradlew docs
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          PYRONAUT_GIT_TOKEN: ${{ secrets.PYRONAUT_GIT_TOKEN || secrets.GH_TOKEN }}
          PYRONAUT_GIT_USERNAME: ${{ secrets.PYRONAUT_GIT_USERNAME || secrets.GH_USERNAME || 'x-access-token' }}
          PYRONAUT_GRAALPY_BUNDLE_URL: ${{ secrets.PYRONAUT_GRAALPY_BUNDLE_URL }}
      - name: Export Gradle Properties
        uses: micronaut-projects/github-actions/export-gradle-properties@master
      - name: LATEST_TAG
        run: |
          echo "LATEST_TAG=$(curl -s -L -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')" >> $GITHUB_ENV
      - name: Publish to Github Pages
        if: success()
        uses: micronaut-projects/github-pages-deploy-action@master
        env:
          BETA: ${{ !(github.event.release.tag_name == env.LATEST_TAG) || github.event.release.draft || github.event.release.prerelease || contains(steps.release_version.outputs.release_version, 'M') || contains(steps.release_version.outputs.release_version, 'RC') }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/docs
          VERSION: ${{ steps.release_version.outputs.release_version }}
          TARGET_REPOSITORY: ${{ github.repository == 'micronaut-projects/micronaut-core' && env.docsRepository || github.repository }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
      - name: Run post-release
        if: success()
        uses: micronaut-projects/github-actions/post-release@master
        env:
          MICRONAUT_BUILD_EMAIL: ${{ secrets.MICRONAUT_BUILD_EMAIL }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  provenance-subject:
    needs: [release]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      artifacts-sha256: ${{ steps.set-hash.outputs.artifacts-sha256 }}
    steps:
      - name: Download artifacts-sha256
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: artifacts-sha256
      # The SLSA provenance generator expects the hash digest of artifacts to be passed as a job
      # output. So we need to download the artifacts-sha256 and set it as job output. The hash of
      # the artifacts should be set as output directly in the release job. But due to a known bug
      # in GitHub Actions we have to use a workaround.
      # See https://github.com/community/community/discussions/37942.
      - name: Set artifacts-sha256 as output
        id: set-hash
        shell: bash
        run: echo "artifacts-sha256=$(cat artifacts-sha256)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [release, provenance-subject]
    if: github.event_name == 'release'
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.provenance-subject.outputs.artifacts-sha256 }}"
      upload-assets: true # Upload to a new release.
      compile-generator: true # Build the generator from source.

  github_release:
    needs: [release, provenance]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Download artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: gradle-build-outputs
          path: build/repo
      - name: Create artifacts archive
        shell: bash
        run: |
          find build/repo -type f \( \( -iname "*.jar" -not -iname "*-javadoc.jar" -not \
              -iname "*-sources.jar" \) -or -iname "*.pom" \) | xargs zip artifacts.zip
      - name: Upload assets
        # Upload the artifacts to the existing release. Note that the SLSA provenance will
        # attest to each artifact file and not the aggregated ZIP file.
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: artifacts.zip

  build-crema-images:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Resolve release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+([.][0-9]+)*(-SNAPSHOT)?$ ]]; then
            echo "Unsupported release tag: ${RELEASE_TAG}"
            exit 1
          fi
          tag="v${version}"
          release_json="$(gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -c --arg tag "${tag}" 'add | map(select(.tag_name == $tag)) | first')"
          if [[ -z "${release_json}" || "${release_json}" == "null" ]]; then
            echo "Release ${tag} was not found"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          printf '%s' "${release_json}" > release.json

      - name: Download release bundles
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p crema-context
          for runtime in run run-python; do
            for release_arch in amd64 aarch64; do
              if [[ "${release_arch}" == "amd64" ]]; then
                buildx_arch=amd64
              else
                buildx_arch=arm64
              fi
              asset="pyronaut-${runtime}-linux-${release_arch}-${VERSION}.tar.gz"
              asset_id="$(jq -r --arg name "${asset}" \
                '.assets[] | select(.name == $name) | .id' release.json)"
              if [[ -z "${asset_id}" || "${asset_id}" == "null" ]]; then
                echo "Release is missing ${asset}"
                exit 1
              fi
              context="crema-context/${runtime}"
              mkdir -p "${context}/bundles/${buildx_arch}"
              gh api \
                -H 'Accept: application/octet-stream' \
                "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "${context}/bundles/${buildx_arch}/bundle.tar.gz"
              tar -tzf "${context}/bundles/${buildx_arch}/bundle.tar.gz" > /dev/null
            done
          done

      - name: Write container definitions
        shell: bash
        run: |
          set -euo pipefail
          for runtime in run run-python; do
            cat > "crema-context/${runtime}/Dockerfile" <<'EOF'
          # syntax=docker/dockerfile:1
          FROM --platform=$BUILDPLATFORM alpine:3.22 AS unpack
          ARG TARGETARCH
          COPY bundles/ /bundles/
          RUN mkdir /out && tar -xzf "/bundles/${TARGETARCH}/bundle.tar.gz" -C /out

          FROM gcr.io/distroless/base-debian12
          WORKDIR /opt/pyronaut
          COPY --from=unpack /out/ /opt/pyronaut/bin/
          EOF
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container images
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          image_owner="${GITHUB_REPOSITORY_OWNER,,}"
          for runtime in run run-python; do
            image="ghcr.io/${image_owner}/pyronaut-${runtime}:${VERSION}"
            docker buildx build \
              --file "crema-context/${runtime}/Dockerfile" \
              --platform linux/amd64,linux/arm64 \
              --tag "${image}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --push \
              "crema-context/${runtime}"
            echo "Published ${image}"
          done

  update-setup-pyronaut:
    # Points the `pyronaut-version` default of the setup-pyronaut action at the
    # release just published, by sending a pull request to that repository.
    # Runs once the release itself has been published; a manual dispatch
    # re-sends the pull request for an existing release tag.
    needs: [release]
    if: >-
      !cancelled()
      && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
      && !github.event.release.prerelease
      && !github.event.release.draft
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Not a final release version: ${RELEASE_TAG}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Checkout setup-pyronaut
        uses: actions/checkout@v6
        with:
          repository: micronaut-projects/setup-pyronaut
          token: ${{ secrets.GH_TOKEN }}
          path: setup-pyronaut
      - name: Update the default Pyronaut version
        shell: bash
        working-directory: setup-pyronaut
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # Rewrite only the `default:` of the `pyronaut-version` input.
          awk -v version="${VERSION}" '
            /^  [a-z0-9-]+:[[:space:]]*$/ { in_input = ($1 == "pyronaut-version:") }
            in_input && /^    default:/ { sub(/default:.*/, "default: '\''" version "'\''"); in_input = 0; updated = 1 }
            { print }
            END { if (!updated) exit 1 }
          ' action.yml > action.yml.tmp
          mv action.yml.tmp action.yml
          # Keep the inputs table in the README in step with action.yml.
          sed -E -i "s/^(\| \`pyronaut-version\` \| )\`[^\`]*\`/\1\`${VERSION}\`/" README.md
          grep -q "default: '${VERSION}'" action.yml
          grep -q "^| \`pyronaut-version\` | \`${VERSION}\` |" README.md
          git diff
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          path: setup-pyronaut
          token: ${{ secrets.GH_TOKEN }}
          branch: pyronaut-${{ steps.release.outputs.version }}
          base: main
          commit-message: Default to Pyronaut ${{ steps.release.outputs.version }}
          title: Default to Pyronaut ${{ steps.release.outputs.version }}
          body: |
            Updates the default `pyronaut-version` to [${{ steps.release.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}), the latest Pyronaut release.
          committer: micronaut-build <${{ secrets.MICRONAUT_BUILD_EMAIL }}>
          author: micronaut-build <${{ secrets.MICRONAUT_BUILD_EMAIL }}>
          delete-branch: true
