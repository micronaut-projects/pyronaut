# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: GraalVM Dev CI
on:
  schedule:
    - cron: "0 1 * * 1-5" # Mon-Fri at 1am UTC
jobs:
  build:
    if: github.repository != 'micronaut-projects/micronaut-project-template'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
      DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
      DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
      GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      PYRONAUT_GIT_TOKEN: ${{ secrets.PYRONAUT_GIT_TOKEN || secrets.GH_TOKEN }}
      PYRONAUT_GIT_USERNAME: ${{ secrets.PYRONAUT_GIT_USERNAME || secrets.GH_USERNAME || 'x-access-token' }}
      PYRONAUT_GRAALPY_BUNDLE_URL: ${{ secrets.PYRONAUT_GRAALPY_BUNDLE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GRAALVM_QUICK_BUILD: true
      ORG_GRADLE_PROJECT_pyronautNativeImageCiArgs: "--parallelism=1"
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)
      - uses: actions/checkout@v6

      - name: "🔧 Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: "💾 Cache source dependency checkouts"
        uses: ./.github/actions/cache-source-dependencies

      - name: "🔧 Setup GraalPy pyenv virtualenv"
        uses: ./.github/actions/setup-graalpy-pyenv

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper/dists
            jdks

      - name: "🧪 Run focused native functional tests"
        timeout-minutes: 30
        run: |
          ./gradlew --stop
          trap './gradlew --stop' EXIT
          ./gradlew :micronaut-functional-test:test -Pnative=true --max-workers=1 --no-daemon --continue
